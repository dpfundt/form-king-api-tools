          x-pointInTimeStability: FROZEN_PRE_RACE
        horse:
          type: string
          description: Name of the horse. **Point-in-time integrity:** Locked at the
            scheduled race jump time and never rewritten afterwards.
          example: Twoexcel
          x-pointInTimeStability: FROZEN_PRE_RACE
        locked:
          type: boolean
          description: Whether this entry has been manually locked in the X,Y speedmap
