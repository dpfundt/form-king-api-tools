          x-pointInTimeStability: FROZEN_PRE_RACE
        horse:
          $ref: '#/components/schemas/HorseLite'
          description: Basic horse details including name, sire and dam.
        jockey:
          type: string
          description: Name of the jockey. **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          example: Rocky Cheung
          x-pointInTimeStability: FROZEN_PRE_RACE
        number:
          type: integer
          description: Saddlecloth/runner number. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: 9
          x-pointInTimeStability: FROZEN_PRE_RACE
        scratched:
          type: boolean
          description: Whether this runner has been scratched. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        trainer:
          type: string
          description: Name of the trainer. **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          example: Jonathon Jachmann
          x-pointInTimeStability: FROZEN_PRE_RACE
      required:
      - barrier
      - horse
      - number
      - scratched
      - trainer
      description: A lightweight runner entry for use in meeting summary lite responses,
        containing only the key identification and status fields.
    RaceEntryMetadata:
      type: object
      title: RaceEntryMetadata
      properties:
        peakRatings:
          type: array
          description: Collection of peak ratings achieved by the horse. This field
            has been deprecated in favour of RaceEntry::ratings. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          deprecated: true
          x-pointInTimeStability: FROZEN_PRE_RACE
      required: []
      description: Contains auxiliary metadata about the RaceEntry item. At the moment,
        peakRatings is the only information contained within.
    RaceEntryOdds:
      type: object
      title: RaceEntryOdds
      properties:
        avgNow:
          type: number
          description: The average corporate bookmaker price at the time of the most
            recent fluctuation. See 'timestamp' for when this fluc occurred. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        avgOpen:
          type: number
          description: The average corporate bookmaker price at market open, which
            is typically around 15-20 minutes after the TAB market opens. As such,
            some artificially high TAB open prices are not included as they've already
            been knocked off by this point. **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        bestBookies:
          type: array
          items:
            type: string
          description: A list of lowercase bookmaker names that are currently offering
            the best price (from Betwatch's bookmakerLower field). **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        bestNow:
          type: number
          description: The best corporate bookmaker price at the time of the most
            recent fluctuation. This field is not always pre-race! See 'timestamp'
            for when this fluc occurred, to confirm whether it was last fetched prior
            to the scheduled race time (see also RaceSummary::date) **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        firmOrDrift:
          type: number
          description: The % change in the market's opinion of this runner since open.
            A value of -5 would mean that the runner has drifted by 5% chance of winning
            (say from $4 - a 25% chance to $5 - a 20% chance). This value is normalised
            for bookmaker % change and scratchings, making it a great indicator of
            where money is (or isn't) being placed. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        flucs:
          type: array
          items:
            $ref: '#/components/schemas/Fluctuation'
          description: The complete list of (corporate bookmaker average price) betting
            fluctuations for this runner, since open. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        timestamp:
          type: integer
          description: The time of the latest fluctuation, as a Unix timestamp in
            UTC (milliseconds since Epoch). **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
      required:
      - avgNow
      - avgOpen
      - bestBookies
      - bestNow
      - firmOrDrift
      - flucs
      - timestamp
      description: An object containing basic live market odds information for the
        RaceEntry. This field will only be present if we have obtained an odds market
        from our provider, and the data contained within can be up to 15 minutes delayed
        from the live odds.
    RaceEntryRatings:
      type: object
      title: RaceEntryRatings
      properties:
        exp:
          type: number
          description: The runner's market expected rating on the Form King scale.
            This value is calculated from the market opinion, using the latest RaceEntry::odds::flucs
            value (not after the scheduled race time), and the Race::lws (likely winning
            standard) and Race::expAdj value, which helps frame the expected rating
            nicely within past ratings for today's race. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        neural:
          type: number
          description: The Form King Neural rating. This is not a measure of performance,
            rather a collection of points awarded to runners based on traditional
            form and statistics. It includes jockey, trainer, track, distance, beaten
            margin and other similar items. **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        peak:
          type: number
          description: The runner's career peak rating on the Form King scale, adjusted
            to weight carried today. **Point-in-time integrity:** Locked at the scheduled
            race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        peak12m:
          type: number
          description: The runner's 12 month peak rating on the Form King scale, adjusted
            to weight carried today. **Point-in-time integrity:** Locked at the scheduled
            race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        timestamp:
          type: integer
          description: The timestamp matching the fluc used for the exp calculation,
            as a Unix timestamp in UTC (milliseconds since Epoch). **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
      required:
      - timestamp
      description: A convenience object that contains a series of ratings for the
        RaceEntry in today's race. Contains the Form King Neural Rating, and the Market
        Expected Rating (EXP, when odds market is available).
    RaceLite:
      type: object
      title: RaceLite
      properties:
        distance:
          type: integer
          description: Race distance in metres. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: 1100
          x-pointInTimeStability: FROZEN_PRE_RACE
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RaceEntryLite'
          description: List of runners in this race with basic details. **Point-in-time
