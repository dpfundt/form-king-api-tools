          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalDataProgressResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '500':
          description: Internal server error
      parameters: []
      description: Lists your own historical data archives as full progress JSON objects
        (same shape as GET /b2c/account/historicaldata/{archiveId}), sorted by startTime
        descending. Always scoped to your own account, resolved from your API key
        or Firebase JWT. Returns 404 if your account is not found or inactive.
