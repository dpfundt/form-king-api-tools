      in: header
      name: x-api-key
      description: "API key required for all requests. \nFor demonstration purposes,\
        \ you can use: `FK-TEST-API-KEY`\n"
  schemas:
    AccountInfo:
      type: object
      title: AccountInfo
      properties:
        uid:
          type: string
          description: Firebase uid of the account.
        apiKey:
          type: string
          description: The account's active API key.
        tier:
          type: string
          description: Current subscription tier (lite, single-state-pro, or pro).
        keyType:
          type: string
          description: TRIAL or PRODUCTION.
        bundledBalance:
          type: integer
          description: Remaining bundled subscription credits for the current period.
        topupBalance:
          type: integer
          description: Remaining top-up credit balance (never expires).
        bundledPeriodStart:
          type: integer
          description: Epoch milliseconds marking the start of the current bundled
            credit period.
        bundledPeriodEnd:
          type: integer
          description: Epoch milliseconds marking the end of the current bundled credit
            period.
        active:
          type: boolean
          description: Whether the account is currently active.
        adminRevoked:
          type: boolean
          description: Whether the account was revoked by an admin (as opposed to
            a self-service cancellation).
        createdAt:
          type: integer
          description: Epoch seconds when the account/API key was created.
        email:
          type: string
          description: Subscriber email address, if known.
        authorities:
          type: array
          items:
            type: string
          description: Authorisation scopes granted, e.g. FK_PRO, FK_WEB.
        pendingBundledBalance:
          type: integer
          description: "Synthesised, non-persisted field: the sum of `creditAmount`\
            \ across all PENDING BUNDLED records in the b2capi_credits ledger for\
            \ this uid \u2014 bundled credits already paid for but not yet rolled\
            \ into bundledBalance."
        pendingCreditRecords:
          type: array
          description: 'Synthesised, non-persisted field: the raw PENDING BUNDLED
            b2capi_credits ledger record(s) backing pendingBundledBalance. Compare
            pendingCreditRecords[0].tier to tier to detect a pending downgrade.'
          items:
            $ref: '#/components/schemas/PendingCreditRecord'
      required:
      - uid
      - apiKey
      - tier
      - bundledBalance
      - topupBalance
      - active
      description: A `b2capi` account record, augmented at query time with pending
        bundled-credit information derived from the b2capi_credits ledger.
    AccountKeysRequest:
      title: AccountKeysRequest
      oneOf:
      - $ref: '#/components/schemas/CreateApiKeyRequest'
      - $ref: '#/components/schemas/RevokeApiKeyRequest'
      - $ref: '#/components/schemas/GetAccountInfoRequest'
      discriminator:
        propertyName: operation
        mapping:
          createApiKey: '#/components/schemas/CreateApiKeyRequest'
          revokeApiKey: '#/components/schemas/RevokeApiKeyRequest'
          getAccountInfo: '#/components/schemas/GetAccountInfoRequest'
      description: 'Discriminated request body for POST /b2c/account/keys, selected
        by the `operation` field: `createApiKey` (CreateApiKeyRequest), `revokeApiKey`
        (RevokeApiKeyRequest), or `getAccountInfo` (GetAccountInfoRequest).'
    ApprovalRequest:
      type: object
      title: ApprovalRequest
      description: Optional request body for PUT /b2c/admin/historicaldata/{archiveId}/approval.
        Controls whether a pending self-service archive request is approved or rejected.
      properties:
        approve:
          type: boolean
          default: true
          description: 'true (or omitted) approves the request: status moves to `STARTING`
            and the build is enqueued. false rejects the request: status moves to
            `APPROVAL_REJECTED` and no build is enqueued.'
    BasicFluc:
      type: object
      title: BasicFluc
      properties:
        favourite:
          type: boolean
          description: Whether the horse was the market favourite at the time of this
            fluctuation.
        price:
          type: number
          description: The fixed odds price at this point in time.
        time:
          type: integer
          description: Unix timestamp (milliseconds) representing the time of this
            fluctuation.
      required:
      - favourite
      - price
      description: A single price fluctuation entry for a horse, recording whether
        it was favourite, the price, and the time of the fluctuation.
    BenchmarkedRun:
      type: object
      title: BenchmarkedRun
      properties:
        age:
          type: integer
          description: Racing age of the horse in years, at the time of this race.
        atWeights:
          type: number
          description: Form King Performance Rating for this runner, represented at
            the weight carried.
        bestToteWin:
          type: number
          description: Best TAB TOTE win price across all 3 TOTEs.
        bsp:
          type: number
          description: Betfair Starting Price.
        dataStage:
          type: string
          description: Processing stage of the data. FULL_SECTIONAL_DATA is the final
            stage of processing.
        expectedRating:
          type: number
          description: A market expected rating for this runner, calculated using
            the Betfair Starting Price, as well as the Form King Likely Winning Standard.
        finishingSpeed:
          type: number
          description: The runner's final 600m in metres per second, represented as
            a percentage of their to 600m speed in metres per second.
        firmOrDrift:
          type: number
          description: The amount of firm or drift in fixed odds betting from open
            to close, represented in % chance of winning and normalised for bookmaker
            percentage change and scratchings.
        meetingRunners:
          type: integer
          description: Number of runners at the meeting.
        pir10:
          type: integer
          description: Position in running at the 1000m marker. Will not be present
            for races < 1000m.
        pir12:
          type: integer
          description: Position in running at the 1200m marker. Will not be present
            for races < 1200m.
        pir2:
          type: integer
          description: Position in running at the 200m marker.
        pir4:
          type: integer
          description: Position in running at the 400m marker.
        pir6:
          type: integer
          description: Position in running at the 600m marker.
        pir8:
          type: integer
          description: Position in running at the 800m marker. Will not be present
            for races < 800m.
        raceRating:
          type: number
          description: Race rating at the weights carried. Represents winning time
            as a rating, after adjustments.
        raceRunners:
          type: integer
          description: Number of runners in this race.
        railMetres:
          type: number
          description: Rail position from True (0) in metres.
          example: 0.0
        season:
          type: string
          description: Racing season identifier.
        sections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BenchmarkedSection'
          propertyNames:
            $ref: '#/components/schemas/SectionKey'
          x-additionalPropertiesName: SectionKey
          description: "Performance metrics and rankings for all benchmarked sections\
            \ of this race. Each section has an entry keyed by its section key (e.g.\
            \ \"S-6\", \"2-F\", or \"4-2\"). Includes benchmarks vs the Form King\
            \ All Average, Class, Track benchmarks as well as versus the race field,\
            \ leader and winner times, plus race and meeting rankings within that\
            \ section if available. You can actually synthesise further data points\
            \ by combining some fields. For example, we provide vsClass and vsLeader,\
            \ but not what the field leader did vsClass. If you calculate (vsClass\
            \ \u2212 vsLeader), that will give you the field leader value against\
            \ the FK Class benchmark for that section. This method applies to vsWinner\
            \ and vsField as well, and the same can be done for All average and Track\
            \ benchmarks."
        sp:
          type: number
          description: Official Starting Price.
        speedRating:
          type: number
          description: Form King Speed Rating for this run. 100 represents the horse
            running to the class "par.", and these values are not tempo adjusted.
        vsAllAvg:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King All Average benchmark. This figure is adjusted for track
            speed, but not tempo.
        vsClass:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King Class benchmark. This figure is adjusted for track speed,
            but not tempo.
        vsTrack:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King Track benchmark. This figure is adjusted for track speed,
            but not tempo.
        wfaRat:
          type: number
          description: Form King Performance Rating for this runner, adjusted to the
            runner's Weight For Age allocation (see also wfaDiff).
      required:
      - age
      - atWeights
      - dataStage
      - finishingSpeed
      - firmOrDrift
      - meetingRunners
      - pir2
      - pir4
      - pir6
      - raceRating
      - raceRunners
      - railMetres
      - season
      - sections
      - sp
      - speedRating
      - vsAllAvg
      - vsClass
      - vsTrack
      - wfaRat
      description: A detailed record focused the performance aspect of a past race
        for a horse. Contains the full complement of sectional benchmarks against
        the Form King All Average, Class, Track benchmarks as well as versus the race
        field, leader and winner, plus race and meeting rankings within that section
        if available. Also contains Weight For Age performance ratings, the Form King
        Speed Rating, finishing speed %, position in run data, various starting prices
        and firm/drift information and more. Benchmarking data is only returned for
        Form King Pro or Single State Pro subscriptions.
    BenchmarkedSection:
      type: object
      title: BenchmarkedSection
      properties:
        meetRank:
          type: integer
          description: Raw split time ranking for this section at the meeting. Available
            for some late sections only.
        meetRatingRank:
          type: integer
          description: Distance-normalised (using lengths +/- the Form King Track
            Benchmark) ranking for this horse within this section at the meeting.
            Available for some late sections only.
        raceRank:
          type: integer
          description: Raw split time ranking for this horse within this section in
            this race. Available for some late sections only.
        vsAllAvg:
          type: number
          description: Lengths +/- the Form King All Average Benchmark for this section.
            Positive is above par.
        vsClass:
          type: number
          description: Lengths +/- the Form King Class Benchmark for this section.
            Positive is above par.
        vsField:
          type: number
          description: Lengths +/- the field average for this section. Positive is
            above par.
        vsLeader:
          type: number
          description: Lengths +/- the field leader for this section. Positive is
            above par.
        vsTrack:
          type: number
          description: Lengths +/- the Form King Track Benchmark for this section.
            Positive is above par.
        vsWinner:
          type: number
          description: Lengths +/- the race winner for this section. In a dead heat
            for 1st place, one race winner is chosen at random. Positive is above
            par.
      required:
      - vsAllAvg
      - vsClass
      - vsField
      - vsLeader
      - vsTrack
      - vsWinner
      description: Sectional performance data for a specific section of a race (e.g.
        S-6, 6-4, 12-F), including benchmarks vs the Form King All Average, Class,
        Track benchmarks as well as versus the race field, leader and winner times,
        plus race and meeting rankings within that section if available.
    CreateApiKeyRequest:
      type: object
      title: CreateApiKeyRequest
      properties:
        operation:
          type: string
          enum:
          - createApiKey
        uid:
          type: string
          description: Firebase uid of the account to create (or re-activate).
        tier:
          type: string
          description: Initial subscription tier. Defaults to `lite`. Determines the
            initial bundledBalance via the product's includedApiCredits.
        name:
          type: string
          description: Optional subscriber name.
        email:
          type: string
          description: Optional subscriber email.
        acceptedTermsVersion:
          type: string
          description: Version of the terms and conditions accepted by the user. Required
            for self-service calls.
        acceptedTermsDate:
          type: integer
          description: Epoch milliseconds when the terms were accepted. Required for
            self-service calls.
      required:
      - operation
      - uid
      description: 'Request body for `operation: createApiKey` on POST /b2c/account/keys.
        Creates a new API key/account, or re-activates an existing self-cancelled
        one.'
    DailyUsageSummary:
      type: object
      title: DailyUsageSummary
      properties:
        bundledUsed:
          type: integer
          description: Total bundled subscription credits deducted on this day.
        byOperation:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UsageOperationSummary'
          description: Map of operation names to their call counts and credit totals
            on this day.
        creditsDeducted:
          type: integer
          description: Total credits deducted across all API calls on this day.
        date:
          type: string
          description: Calendar date for this usage summary in YYYY-MM-DD format.
          example: 1778803200000
        topupUsed:
          type: integer
          description: Total top-up credits deducted on this day.
        totalCalls:
          type: integer
          description: Total number of API calls made on this day.
      required:
      - bundledUsed
      - byOperation
      - creditsDeducted
      - date
      - topupUsed
      - totalCalls
      description: Aggregated daily summary of API requests, credits deducted, and
        per-operation usage breakdown.
    DualAcceptance:
      type: object
      title: DualAcceptance
      properties:
        barrier:
          type: integer
          description: Barrier drawn for this acceptance.
        date:
          type: integer
          description: Scheduled race time as a Unix milliseconds timestamp (UTC).
          example: 1778803200000
        distance:
          type: integer
          description: Race distance in metres.
        going:
          type: string
          description: Track condition at the time of acceptance.
        meetingId:
          type: string
          description: Form King unique meeting identifier.
          example: ABNY_150526
        name:
          type: string
          description: Full name of the race.
        raceId:
          type: string
          description: Unique identifier for this race.
        raceNumber:
          type: string
          description: Race number on the card.
        scratched:
          type: boolean
          description: Whether the horse was scratched from this acceptance.
        trackName:
          type: string
          description: Name of the track.
          example: Albany
      required:
      - barrier
      - date
      - distance
      - going
      - meetingId
      - name
      - raceId
      - raceNumber
      - scratched
      - trackName
      description: "A race acceptance entry for a dual acceptor \u2014 a horse entered\
        \ in more than one upcoming or recent race. Contains enough information to\
        \ allow consumers to link to or retrieve information about the additional\
        \ acceptance."
    EarlySpeedMetrics:
      type: object
      title: EarlySpeedMetrics
      properties:
        benchmark:
          type: number
          description: The Form King All Average benchmark at the determined settling
            position, converted to a benchmark for today's race. RAW values are expressed
            as lengths vs benchmark, with positive being above (faster than) par.
          example: 2.8459540165665698
        gap:
          type: number
          description: The distance from the lead horse, at the distance marker we've
            determined to be the settling position. RAW values are in lengths.
          example: 9.17
        overall:
          type: number
          description: A holistic score for the early speed for the horse in the context
            that this metrics entity is included. RAW values are always a speed figure
            between 1-10.
          example: 5.715477008283285
        pir:
          type: number
          description: A score for the Position In Running (PIR), RAW values are the
            horse's settling position at the 600m for races <= 1050m, otherwise the
            first available section marker from the 1200m (one of 12, 10, 8).
          example: 8.0
        type:
          type: string
          description: This field will tell you the type of value for the fields this
            metrics entity. "SPEED_FIGURE" means that any raw value has been converted
            to a number between 1 and 10, for use with a speedmap bar. RAW means that
            the value is a raw number, expressed on the natural scale for each metric.
      required:
      - overall
      - type
    ExpectedTempo:
      type: object
      title: ExpectedTempo
      properties:
        description:
          type: string
          description: The full expected tempo range, expressed as a textual description
            ({min} to {max}). If min and max land in the same category, the description
            will be a single value.
          example: Average
        max:
          type: string
          description: The maximum of the expected tempo range, expressed in lengths
            +/- the Form King benchmark for this race, per 100m to the settling position
            marker.
          example: '-0.03'
        maxCategory:
          type: string
          description: The maximum of the expected tempo range, expressed as a textual
            description.
          example: Average
        min:
          type: string
          description: The minimum of the expected tempo range, expressed in lengths
            +/- the Form King benchmark for this race, per 100m to the settling position
            marker.
          example: '-0.19'
        minCategory:
          type: string
          description: The minimum of the expected tempo range, expressed as a textual
            description.
          example: Average
      required:
      - description
      - maxCategory
      - minCategory
    Form:
      type: object
      title: Form
      properties:
        careerForm:
          type: string
          description: Summary of horse's career performance.
          example: 2:0-0-1
        classForm:
          type: string
          description: Summary of performance at the current class level.
          example: 0:0-0-0
        dead:
          type: string
          description: Career record on dead tracks.
        distanceForm:
          type: string
          description: Summary of performance at today's distance.
          example: 0:0-0-0
        firm:
          type: string
          description: Career record on firm tracks.
        firstUpForm:
          type: string
          description: Performance history in first-up runs.
          example: 1:0-0-1
        flatForm:
          type: string
          description: Performance history on flat tracks.
          example: 2:0-0-1
        goingForm:
          $ref: '#/components/schemas/GoingForm'
          description: Summarises win/place record for each official track condition/going
            category.
        good:
          type: string
          description: Career record on good tracks.
        goodForm:
          type: string
          description: Performance summary on good tracks.
          example: 0:0-0-0
        heavy:
          type: string
          description: Career record on heavy tracks.
        heavyForm:
          type: string
          description: Performance summary on heavy tracks.
          example: 0:0-0-0
        hurdleForm:
          type: string
          description: Performance history in hurdle races.
          example: 0:0-0-0
        insideBarriers:
          type: string
          description: Performance history from inside barriers.
          example: 2:0-0-1
        lengthsBeatenLastThree:
          type: number
          description: Total lengths beaten in the last three starts.
          example: 6.02
        longRaces:
          type: string
          description: Performance history in long distance races.
          example: 0:0-0-0
        middleBarriers:
          type: string
          description: Performance history from middle barriers.
          example: 0:0-0-0
        middleRaces:
          type: string
          description: Performance history in middle distance races.
          example: 0:0-0-0
        mileRaces:
          type: string
          description: Performance history in mile races.
          example: 0:0-0-0
        nightForm:
          type: string
          description: Performance history in night meetings.
          example: 0:0-0-0
        runs:
          type: string
          description: Total number of career starts.
          example: 38x
        secondUpForm:
          type: string
          description: Performance history in second-up runs.
          example: 1:0-0-0
        shortCourseRaces:
          type: string
          description: Performance history in short course races.
          example: 2:0-0-1
        similarDistance:
          type: string
          description: Performance history at similar distances.
          example: 2:0-0-1
        slow:
          type: string
          description: Career record on slow tracks.
        soft:
          type: string
          description: Career record on soft tracks.
        sprintRaces:
          type: string
          description: Performance history in sprint races.
          example: 0:0-0-0
        stayingRaces:
          type: string
          description: Performance history in staying races.
          example: 0:0-0-0
        steepleForm:
          type: string
          description: Performance history in steeplechase races.
          example: 0:0-0-0
        synthetic:
          type: string
          description: Career record on synthetic tracks.
        thirdUpForm:
          type: string
          description: Performance history in third-up runs.
          example: 0:0-0-0
        todaysGoingForm:
          type: string
          description: 'Form string for today''s specific track condition (e.g. "3:
            1-0-1-1"). Derived from goingForm keyed on today''s going category.'
        todaysWeight:
          type: string
          description: Performance history carrying today's weight.
          example: 1:0-0-1
        trackAndDistanceForm:
          type: string
          description: Performance history at today's track and distance.
          example: 0:0-0-0
        trackForm:
          type: string
          description: Performance history at today's track.
          example: 0:0-0-0
        wet:
          type: string
          description: Career record on wet tracks.
        wideBarriers:
          type: string
          description: Performance history from wide barriers.
          example: 0:0-0-0
        wonWithTodaysWeightOrHigher:
          type: boolean
          description: Boolean indicating if the horse has won carrying today's weight
            or more.
      required:
      - careerForm
      - classForm
      - dead
      - distanceForm
      - firm
      - firstUpForm
      - flatForm
      - goingForm
      - good
      - goodForm
      - heavy
      - heavyForm
      - hurdleForm
      - insideBarriers
      - lengthsBeatenLastThree
      - longRaces
      - middleBarriers
      - middleRaces
      - mileRaces
      - nightForm
      - runs
      - secondUpForm
      - shortCourseRaces
      - similarDistance
      - slow
      - soft
      - sprintRaces
      - stayingRaces
      - steepleForm
      - synthetic
      - thirdUpForm
      - todaysGoingForm
      - todaysWeight
      - trackAndDistanceForm
      - trackForm
      - wet
      - wideBarriers
      - wonWithTodaysWeightOrHigher
      description: A summary of a horse's performance history across various dimensions
        including career, class, distance, going, barrier, and jockey/trainer combinations.
    FormSummary:
      type: object
      title: FormSummary
      properties:
        averageBeatenMargin:
          type: number
          description: The average beaten margin across all starts in this window.
        averageFirmOrDrift:
          type: number
          description: The average firm or drift value across all starts in this window.
        proportionalStakingROI:
          type: number
          description: Return on investment using proportional staking across all
            starts in this window.
        races:
          type: integer
          description: Total number of races included in this summary window.
        seconds:
          type: integer
          description: Number of second-place finishes in this window.
        thirds:
          type: integer
          description: Number of third-place finishes in this window.
        wins:
          type: integer
          description: Number of wins in this window.
        winsOverExpectations:
          type: number
          description: Wins above the market-implied expectation across all starts
            in this window. A value of 1 means that wins = expectedWins. A value above
            1 means that there have been more wins than expected wins, and below 1
            is less than expected.
      required:
      - averageBeatenMargin
      - averageFirmOrDrift
      - proportionalStakingROI
      - races
      - seconds
      - thirds
      - wins
      - winsOverExpectations
      description: A summary of form for horses that ran in a past race, across a
        defined window of subsequent starts (ALL, NEXT_10, or NEXT_20).
    Gear:
      type: object
      title: Gear
      properties:
        change:
          type: string
          description: Whether this gear item is a change from the previous race.
          example: ON_FIRST_TIME
        gear:
          type: string
          description: Name of the gear item (e.g. Blinkers, Tongue Tie).
          example: Gelded
        'on':
          type: boolean
          description: Whether the gear is being worn in this race.
          example: true
      required:
      - change
      - gear
      - 'on'
      description: A single gear item, which contains information about the type of
        gear, whether it is being worn currently, and whether there is a change to
        this item within the context where it is being returned (typically, Race).
    GetAccountInfoRequest:
      type: object
      title: GetAccountInfoRequest
      properties:
        operation:
          type: string
          enum:
          - getAccountInfo
        uid:
          type: string
          description: Firebase uid of the account to look up.
        apiKey:
          type: string
          description: "Alternative to uid \u2014 look up the account by its API key."
      required:
      - operation
      description: "Request body for `operation: getAccountInfo` \u2014 an alternative\
        \ to GET /b2c/account/keys/{uid} that resolves the account by `apiKey` instead\
        \ of `uid`."
    GoingForm:
      type: object
      title: GoingForm
      properties:
        dead:
          type: string
          description: Career record on dead tracks.
        fast:
          type: string
          description: Career record on fast tracks.
        good:
          type: string
          description: Career record on good tracks.
        heavy:
          type: string
          description: Career record on heavy tracks.
        slow:
          type: string
          description: Career record on slow tracks.
        synthetic:
          type: string
          description: Career record on synthetic tracks.
      required:
      - dead
      - fast
      - good
      - heavy
      - slow
      - synthetic
      description: A breakdown of a horse's win/place record by track condition category
        (synthetic, fast, slow, dead, good, heavy).
    HistoricalDataDownloadResponse:
      type: object
      title: HistoricalDataDownloadResponse
      description: Presigned download URL returned by GET /b2c/admin/historicaldata/{archiveId}/download.
      properties:
        url:
          type: string
          description: Presigned S3 URL for downloading the archive's zip file.
        expiresIn:
          type: integer
          description: Number of seconds the presigned URL remains valid for (currently
            300, i.e. 5 minutes).
      required:
      - url
      - expiresIn
    HistoricalDataProgressResponse:
      type: object
      title: HistoricalDataProgressResponse
      description: Progress JSON returned by GET /b2c/admin/historicaldata/{archiveId}.
        Includes the archive password on every poll, not just the initial STARTING
        write.
      properties:
        archiveId:
          type: string
          description: UUID identifying this archive build.
        status:
          type: string
          enum:
          - APPROVAL_REQUIRED
          - STARTING
          - IN_PROGRESS
          - COMPLETE
          - ERROR
          - APPROVAL_REJECTED
          description: Current build status. `APPROVAL_REQUIRED` is the initial state
            for a self-service request, pending admin approval, before it moves to
            `STARTING` (approved) or `APPROVAL_REJECTED` (rejected).
        uid:
          type: string
          description: Target account uid the archive is built for.
        s3Bucket:
          type: string
          description: S3 bucket holding the archive and progress sidecar.
        s3Key:
          type: string
          description: S3 object key for the finished archive.zip.
        password:
          type: string
          description: AES password protecting the archive zip. Present in every progress
            poll, not just at creation time.
        numBenchmarks:
          type: integer
          enum:
          - 5
          - 10
          description: Requested benchmark depth.
        from:
          type: string
          description: Inclusive start date (DDMMYY).
        to:
          type: string
          description: Inclusive end date (DDMMYY).
        states:
          type: string
          nullable: true
          description: Normalised CSV of requested state codes, or null when all states
            were requested.
        dates:
          type: string
          nullable: true
          description: Comma-separated, deduped and sorted DDMMYY dates when explicit
            dates were requested (overriding from/to for day selection), or null when
            a from/to range was used instead.
        startTime:
          type: string
          description: ISO-8601 UTC timestamp when the request was accepted.
        progressTime:
          type: string
          description: ISO-8601 UTC timestamp of the most recent progress update.
        daysProcessed:
          type: integer
          description: Number of calendar days processed so far.
        totalDays:
          type: integer
          description: Total calendar days in the requested range.
        percentComplete:
          type: integer
          description: Approximate completion percentage (0-100).
        etaSeconds:
          type: integer
          description: Linearly extrapolated seconds remaining. Omitted early in the
            build and on terminal COMPLETE.
        errorSummary:
          type: string
          description: Error detail when status is ERROR; otherwise omitted or null.
        sizeBytes:
          type: integer
          description: Byte size of the uploaded archive zip. Present only once status
            is COMPLETE; omitted for STARTING/IN_PROGRESS/ERROR records, and also
            omitted for archives completed before this field was introduced.
        message:
          type: string
          description: Optional free-text use-case description supplied at creation
            time. Omitted entirely (not null) when none was supplied; once set, it
            is present on every subsequent progress/list/approval response.
      required:
      - archiveId
      - status
      - uid
      - s3Bucket
      - s3Key
      - password
      - numBenchmarks
      - from
      - to
      - startTime
    HistoricalDataRequest:
      type: object
      title: HistoricalDataRequest
      properties:
        uid:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          description: Firebase uid of the target b2capi account, or a list of uids.
            Every uid must exist and be active. When a list with more than one uid
            is supplied, the underlying archive data is built once and cloned (relabeled
            with a fresh password and license.md) for each additional uid; the whole
            request is rejected if any uid is invalid/inactive.
        from:
          type: string
          pattern: ^\d{6}$
          description: Inclusive start date in DDMMYY format (e.g. `010725` for 1
            July 2025). Optional if `dates` is supplied, in which case it is ignored.
        to:
          type: string
          pattern: ^\d{6}$
          description: Inclusive end date in DDMMYY format. Must be greater than or
            equal to `from`. Optional if `dates` is supplied, in which case it is
            ignored.
        dates:
          type: string
          description: Optional CSV of up to 10 explicit DDMMYY dates (e.g. `120725,240826`).
            When supplied, overrides `from`/`to` for day selection; effective `from`/`to`
            for the archive filename and progress display are computed as min/max
            of `dates`. More than 10 values returns a 400 error.
        numBenchmarks:
          type: integer
          enum:
          - 5
          - 10
          description: Number of benchmarked past runs to include per runner. Exactly
            5 or 10.
        states:
          type: string
          description: Optional CSV of Australian state codes to include (VIC,NSW,ACT,QLD,NT,WA,SA,TAS).
            Omit or empty for all states.
        message:
          type: string
          maxLength: 1000
          description: Optional free-text use-case description, up to 1000 characters.
            Echoed back in every subsequent progress/list/approval response.
      required:
      - uid
      - numBenchmarks
      description: Request body for POST /b2c/admin/historicaldata. Specifies the
        target account, benchmark depth, and optional state filter for an asynchronous
        historical-data archive build. Either `dates` (up to 10 explicit DDMMYY values)
        or both `from` and `to` (an inclusive DDMMYY range) must be supplied. An optional
        `message` field (up to 1000 characters) can describe the use case for the
        archive.
    HistoricalDataResponse:
      type: object
      title: HistoricalDataResponse
      description: STARTING progress JSON returned by POST /b2c/admin/historicaldata
        (202). Byte-identical to the progress sidecar written to S3 at request time.
      properties:
        archiveId:
          type: string
          description: UUID identifying this archive build.
        status:
          type: string
          enum:
          - APPROVAL_REQUIRED
          - STARTING
          - IN_PROGRESS
          - COMPLETE
          - ERROR
          - APPROVAL_REJECTED
          description: Build status. `STARTING` on the admin-create 202 response;
            `APPROVAL_REQUIRED` on the self-service 202 response, until an admin approves
            or rejects it.
        uid:
          type: string
          description: Target account uid the archive is built for.
        s3Bucket:
          type: string
          description: S3 bucket holding the archive and progress sidecar.
        s3Key:
          type: string
          description: S3 object key for the finished archive.zip.
        progressKey:
          type: string
          description: S3 object key for the progress-{archiveId}.json sidecar.
        password:
          type: string
          description: AES password protecting the archive zip. Present in this creation
            response and in every subsequent progress poll.
        numBenchmarks:
          type: integer
          enum:
          - 5
          - 10
          description: Requested benchmark depth.
        from:
          type: string
          description: Inclusive start date (DDMMYY).
        to:
          type: string
          description: Inclusive end date (DDMMYY).
        states:
          type: string
          nullable: true
          description: Normalised CSV of requested state codes, or null when all states
            were requested.
        dates:
          type: string
          nullable: true
          description: Comma-separated, deduped and sorted DDMMYY dates when explicit
            dates were requested (overriding from/to for day selection), or null when
            a from/to range was used instead.
        apiVersion:
          type: string
          description: API version stamped into the archive metadata.
        startTime:
          type: string
          description: ISO-8601 UTC timestamp when the request was accepted.
        message:
          type: string
          description: Optional free-text use-case description supplied at creation
            time. Omitted entirely (not null) when none was supplied.
      required:
      - archiveId
      - status
      - uid
      - s3Bucket
      - s3Key
      - progressKey
      - password
      - numBenchmarks
      - from
      - to
      - apiVersion
      - startTime
    Horse:
      type: object
      title: Horse
      properties:
        age:
          type: integer
          description: Current racing age of the horse in years.
          example: 2
        calculatedAge:
          type: number
          description: Precise age of the horse in years as calculated from its foal
            date.
          example: 2.6684931506849314
        country:
          type: string
          description: Country of origin.
          example: AUS
        dam:
          type: string
          description: Name of the maternal parent.
          example: Truancy
        foalDate:
          type: integer
          description: Date the horse was foaled.
          example: 1694649600000
        name:
          type: string
          description: Registered name of the horse.
          example: Quagmire
        ownership:
          type: string
          description: Current owners of the horse.
          example: Ms R C Parker, R J Pawsey, Miss C A Toose & Mrs L Manuel
        previousName:
          type: string
          description: Optional - if the horse has raced under another name previously,
            this field will contain the most recent prior name.
        sire:
          type: string
          description: Name of the paternal parent.
          example: Long Leaf
        sireOfDam:
          type: string
          description: The sire of the dam (damsire).
          example: I Am Invincible
        trainingLocation:
          type: string
          description: Where the horse is currently trained.
          example: Flemington
        type:
          type: string
          description: 'The type of horse. Possible values are: F (Filly), M (Mare),
            H (Entire), G (Gelding), C (Colt).'
          example: G
      required:
      - dam
      - name
      - sire
      description: Full horse details, including breeding, age, gender, ownership
        and training location.
    HorseForm:
      type: object
