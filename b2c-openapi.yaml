        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '500':
          description: Internal server error
      parameters:
      - name: archiveId
        in: path
        required: true
        schema:
          type: string
        description: UUID of the archive build whose progress to retrieve.
      description: Returns the current progress JSON for one of your historical data
