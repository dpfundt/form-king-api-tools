      title: PastEvent
      properties:
        adjustedForTodaysWeight:
          type: number
          description: The weightForAgeRating value, adjusted to the weight being
            carried in today's race. See also RaceEntry::weightCarried. If consumed
            outside a Race context, this value will not be present, as there would
            be no weight to make an adjustment to.
        barrier:
          type: integer
          description: Barrier/starting gate jumped from.
          example: 4
        benchmark:
          $ref: '#/components/schemas/BenchmarkedRun'
          description: A detailed record focused the performance aspect of this past
            race. Contains the full complement of sectional benchmarks against the
            Form King All Average, Class, Track benchmarks as well as versus the race
            field, leader and winner, plus race and meeting rankings within that section
            if available. Also contains Weight For Age performance ratings, the Form
            King Speed Rating, finishing speed %, position in run data, various starting
            prices and firm/drift information and more. This entity is considered
            "Pro" data, and as such a Form King Pro or Single State Pro subscription
            is required for benchmarking data to be returned.
        benchmarkRating:
          type: number
          description: Official Handicap Rating (OHR) assigned to the horse prior
            to this race. May be omitted or 0 if no OHR had been assigned (e.g. maidens).
        bsp:
          type: number
          description: Betfair Starting Price.
          example: 1.95581612
        country:
          type: string
          description: Country where the race was held.
          example: Australia
        date:
          type: integer
          description: Race date as a Unix timestamp (milliseconds since Epoch).
          example: 1782223200000
        daysSincePreviousRace:
          type: integer
          description: Days elapsed since the horse's prior race.
        distance:
          type: integer
          description: Race distance in metres.
          example: 1100
        fieldStrength:
          type: number
          description: Strength of the field in this past race.
