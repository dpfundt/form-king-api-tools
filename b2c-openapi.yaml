        emergency:
          type: boolean
          description: Whether this runner is an emergency (reserve) entry. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        gridX:
          type: integer
          description: Used only for custom user maps. The grid position on the X
