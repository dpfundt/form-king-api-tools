          x-pointInTimeStability: FROZEN_PRE_RACE
        metadata:
          $ref: '#/components/schemas/RaceEntryMetadata'
          description: Additional metadata for this entry, including peak ratings.
        number:
          type: integer
          description: Saddlecloth (TAB) number for this entry. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
