            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        earlySpeedValues:
          $ref: '#/components/schemas/EarlySpeedMetrics'
          description: Detailed breakdown of the early speed score, including lengths
