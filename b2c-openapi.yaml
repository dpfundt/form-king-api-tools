    PointInTimeStability:
      type: string
      enum:
      - FROZEN_PRE_RACE
      - FROZEN_POST_RESULT
      - RECALCULATED
      - FROZEN_ON_REVIEW
      - VERSIONED_ON_REVIEW
      title: PointInTimeStability
      description: A classification of how stable a field's value is over time. FROZEN_PRE_RACE
        fields are locked at the scheduled race jump time and never rewritten; FROZEN_POST_RESULT
        fields are locked once the race is officially resulted, but may rarely be
        amended by a stewards' disqualification or protest ruling issued afterwards;
        RECALCULATED fields are always recalculated and never frozen, so are not safe
        for modelling against forever; FROZEN_ON_REVIEW fields behave like RECALCULATED
        until the record passes manual review, after which they will not change for
        any reason unless a significant error is found; VERSIONED_ON_REVIEW fields
        behave like RECALCULATED until the record passes manual review, at which point
        the value is frozen and versioned, but may still be recalculated again in
        future as a new version. See also the `x-pointInTimeStability` vendor extension
        on individual fields.
    RaceEntry:
      type: object
      title: RaceEntry
      properties:
        acceptances:
          type: array
          items:
            $ref: '#/components/schemas/DualAcceptance'
          description: Details of multiple race acceptances. Handy for dual acceptors.
