        for Start to 600m, '12-F' for Last 1200m).
    SelfServiceHistoricalDataRequest:
      type: object
      title: SelfServiceHistoricalDataRequest
      properties:
        from:
          type: string
          pattern: ^\d{6}$
          description: Inclusive start date in DDMMYY format (e.g. `010725` for 1
            July 2025). Optional if `dates` is supplied, in which case it is ignored.
        to:
          type: string
          pattern: ^\d{6}$
          description: Inclusive end date in DDMMYY format. Must be greater than or
            equal to `from`. Optional if `dates` is supplied, in which case it is
            ignored.
        dates:
          type: string
          description: Optional CSV of up to 10 explicit DDMMYY dates (e.g. `120725,240826`).
            When supplied, overrides `from`/`to` for day selection; effective `from`/`to`
            for the archive filename and progress display are computed as min/max
            of `dates`. More than 10 values returns a 400 error.
        numBenchmarks:
          type: integer
          enum:
          - 5
          - 10
          description: Number of benchmarked past runs to include per runner. Exactly
            5 or 10.
        states:
          type: string
          description: Optional CSV of Australian state codes to include (VIC,NSW,ACT,QLD,NT,WA,SA,TAS).
            Omit or empty for all states.
        message:
          type: string
          maxLength: 1000
          description: Optional free-text use-case description, up to 1000 characters,
            explaining why this archive is being requested. Shown to the admin reviewing
            the pending approval, and echoed back in every subsequent progress/list/approval
            response.
      required:
      - numBenchmarks
      description: "Request body for POST /b2c/account/historicaldata. Same as HistoricalDataRequest,\
        \ minus `uid` \u2014 your own uid is always used, resolved from your API key\
        \ or Firebase JWT. Either `dates` (up to 10 explicit DDMMYY values) or both\
        \ `from` and `to` (an inclusive DDMMYY range) must be supplied. The resulting\
        \ archive is not built immediately; it is queued for admin approval (status\
        \ `APPROVAL_REQUIRED`). An optional `message` field (up to 1000 characters)\
        \ lets you describe your use case for the admin reviewing the request."
    Speedmap:
      type: object
      title: Speedmap
      properties:
        custom:
          type: boolean
          description: Whether this speedmap has been manually customised by a Form
            King user. Defaults to false for all owner="formking" default maps. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        direction:
          type: string
          description: The running direction of the race (e.g. CLOCKWISE, ANTI_CLOCKWISE).
            **Point-in-time integrity:** Locked at the scheduled race jump time and
            never rewritten afterwards.
          example: CLOCKWISE
          x-pointInTimeStability: FROZEN_PRE_RACE
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SpeedmapEntry'
          description: List of per-runner SpeedmapEntry items, one per runner in the
            race. **Point-in-time integrity:** Locked at the scheduled race jump time
            and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        expectedTempo:
          $ref: '#/components/schemas/ExpectedTempo'
          description: An object containing the expected race tempo, including a single
            description, min/max pace category and values.
        owner:
          type: string
          description: The source or owner of this speedmap (e.g. "formking", or if
            owned by a user, their UID value). **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: formking
          x-pointInTimeStability: FROZEN_PRE_RACE
        raceId:
          type: string
          description: Unique Form King identifier for the race that this speedmap
            belongs to. **Point-in-time integrity:** Locked at the scheduled race
            jump time and never rewritten afterwards.
          example: NCLE_120326_1
          x-pointInTimeStability: FROZEN_PRE_RACE
      required:
      - custom
      - direction
      - entries
      - owner
      - raceId
      description: A speed map for a single race, containing early speed metrics,
        expected tempo and a list of per-runner SpeedmapEntry items. The owner field
        identifies the source of the speedmap (e.g. 'formking', or a Form King user's
        UID).
    SpeedmapEntry:
      type: object
      title: SpeedmapEntry
      properties:
        barrier:
          type: integer
          description: Barrier number drawn for this runner. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          example: 1
          x-pointInTimeStability: FROZEN_PRE_RACE
        breedingId:
          type: string
          description: Form King unique horse identifier for this race entry. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          example: 2022_exceed-and-excel_wayborn
          x-pointInTimeStability: FROZEN_PRE_RACE
        daysSinceLastRace:
          type: integer
          description: Number of days since this horse last raced. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          example: 143
          x-pointInTimeStability: FROZEN_PRE_RACE
        distanceChange:
          type: integer
          description: Change in race distance compared to the horse's last start,
