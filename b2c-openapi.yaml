          example: 58.0
          x-pointInTimeStability: FROZEN_PRE_RACE
        weightCarried:
          type: number
          description: Actual weight carried in kilograms, including jockey and gear.
            **Point-in-time integrity:** Locked at the scheduled race jump time and
            never rewritten afterwards.
          example: 58.0
          x-pointInTimeStability: FROZEN_PRE_RACE
        wfaDiff:
          type: number
          description: Difference in kilograms from the Form King Weight For Age allocation
