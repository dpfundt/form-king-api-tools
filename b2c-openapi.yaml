      tags:
      - Account
    post:
      responses:
        '202':
          description: "Accepted \u2014 archive build started"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalDataResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '409':
          description: Conflict (e.g. balance adjustment would go negative)
        '500':
          description: Internal server error
        '503':
          description: "Service Unavailable \u2014 unable to resolve product/tier\
            \ configuration"
      description: 'Requests a password-protected historical data archive for your
        own account. Your `uid` is always resolved from your API key or Firebase JWT;
        it is never read from the request body. Unlike the admin endpoint, this does
        not queue the build immediately: it writes a progress sidecar with status
        `APPROVAL_REQUIRED` and returns 202 with the initial progress JSON (including
        the archive password); an admin must approve the request (best-effort notified
        by email) before the build is queued. Optionally accepts a `message` field
        (up to 1000 characters) describing your use case, included in the admin notification
        email and echoed back in every subsequent progress/list/approval response.
        Poll GET /b2c/account/historicaldata/{archiveId} to track the status as it
        moves from `APPROVAL_REQUIRED` to `STARTING` to `IN_PROGRESS` to `COMPLETE`.
        Returns 404 if your account is not found or inactive.'
      summary: Request My Historical Data Archive
      tags:
      - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfServiceHistoricalDataRequest'
  /b2c/account/historicaldata/{archiveId}:
    get:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalDataProgressResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '500':
          description: Internal server error
      parameters:
      - name: archiveId
        in: path
        required: true
        schema:
          type: string
        description: UUID of the archive build whose progress to retrieve.
      description: Returns the current progress JSON for one of your historical data
        archive builds. Always scoped to your own account, resolved from your API
        key or Firebase JWT. Returns 404 if the archive does not exist.
      summary: Get My Historical Data Archive Progress
      tags:
      - Account
  /b2c/account/historicaldata/{archiveId}/download:
    get:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalDataDownloadResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '500':
          description: Internal server error
        '409':
          description: "Conflict \u2014 archive is not yet complete"
      parameters:
      - name: archiveId
        in: path
        required: true
        schema:
          type: string
        description: UUID of the archive build to download.
      description: Generates a short-lived (5 minute) presigned S3 URL for downloading
        one of your COMPLETE historical data archive zip files. Always scoped to your
        own account, resolved from your API key or Firebase JWT. Returns 409 if the
        archive's status is not yet COMPLETE.
      summary: Get My Historical Data Archive Download Link
      tags:
      - Account
  /b2c/account/keys:
    post:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AccountInfo'
                - $ref: '#/components/schemas/RevokeApiKeyResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '409':
          description: Conflict (e.g. balance adjustment would go negative)
        '500':
          description: Internal server error
        '503':
          description: "Service Unavailable \u2014 unable to resolve product/tier\
            \ configuration"
      description: "Creates a new API key/account (`operation: createApiKey`), revokes\
        \ the caller's own key (`operation: revokeApiKey`), or looks up the caller's\
        \ account (`operation: getAccountInfo`, resolved by `uid` or `apiKey` \u2014\
        \ equivalent to GET /b2c/account/keys/{uid}). Callers may only act on their\
        \ own `uid`."
      summary: Create, Revoke or Get API Key / Account
      tags:
      - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountKeysRequest'
  /b2c/account/keys/{uid}:
    get:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
            text/csv:
              schema:
                type: string
                description: 'CSV-formatted response. Use `?format=csv` or `Accept:
                  text/csv` to request this format. Control the flattening level with
                  `?flatten=meeting|race|entry`.'
          headers:
            Content-Disposition:
              description: 'Present when CSV is returned. Value: `attachment; filename="response.csv"`'
              schema:
                type: string
        '307':
          description: Temporary redirect to a pre-signed S3 URL containing the projected
            JSON (large responses > 5 MB). Valid for 6 hours. Clients should follow
            the `Location` header automatically.
          headers:
            Location:
              description: Pre-signed S3 URL for the projected JSON file.
              schema:
                type: string
                format: uri
        '400':
          description: Bad request (invalid parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid `x-api-key`"
        '402':
          description: "Payment Required \u2014 insufficient credit balance"
        '403':
          description: "Forbidden \u2014 access denied or tier restricted"
        '404':
          description: Not found
        '429':
          description: "Too Many Requests \u2014 rate limit exceeded"
        '500':
          description: Internal server error
      parameters:
      - $ref: '#/components/parameters/FormatParam'
      - $ref: '#/components/parameters/FlattenParam'
      - $ref: '#/components/parameters/VersionParam'
      - name: uid
        in: path
        required: true
        schema:
          type: string
      description: 'Returns the caller''s `b2capi` account record, augmented with
        two synthesised, non-persisted fields derived from the `b2capi_credits` ledger:
        `pendingBundledBalance` (sum of `PENDING` BUNDLED ledger records for the user)
        and `pendingCreditRecords` (the underlying ledger record(s)). Callers may
        only view their own account.'
      summary: Get Account Info
      tags:
      - Account
  /b2c/usage:
    get:
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/UsageLogItem'
                - type: array
                  items:
                    $ref: '#/components/schemas/DailyUsageSummary'
          headers:
            Content-Disposition:
              description: 'Present when CSV is returned. Value: `attachment; filename="response.csv"`'
              schema:
                type: string
        '307':
          description: Temporary redirect to a pre-signed S3 URL containing the projected
            JSON (large responses > 5 MB). Valid for 6 hours. Clients should follow
            the `Location` header automatically.
          headers:
            Location:
              description: Pre-signed S3 URL for the projected JSON file.
              schema:
                type: string
                format: uri
        '400':
          description: Bad request (invalid parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid `x-api-key`"
        '402':
          description: "Payment Required \u2014 insufficient credit balance"
        '403':
          description: "Forbidden \u2014 access denied or tier restricted"
        '404':
          description: Not found
        '429':
          description: "Too Many Requests \u2014 rate limit exceeded"
        '500':
          description: Internal server error
      parameters:
      - $ref: '#/components/parameters/FormatParam'
      - $ref: '#/components/parameters/FlattenParam'
      - $ref: '#/components/parameters/VersionParam'
      - name: from
        in: query
        required: false
        description: Start date for usage query in YYYY-MM-DD format (inclusive).
          Defaults to 14 days ago.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: End date for usage query in YYYY-MM-DD format (inclusive). Defaults
          to today.
        schema:
          type: string
          format: date
      - name: aggregate
        in: query
        required: false
        description: 'Aggregation mode. `raw` (default) returns an array of `UsageLogItem`
          records. `daily` returns an array of `DailyUsageSummary` records, one per
          calendar day, instead of raw log entries. Alias: `view=daily`.'
        schema:
          type: string
          enum:
          - raw
          - daily
          default: raw
      description: Returns credit usage log items for the authenticated user (or for
        a specific user if called by an admin). Supports raw log records and daily
        aggregated summaries via the `view` / `aggregate` query parameter, filtered
        by date range.
      summary: Get Usage Log
      tags:
      - Account
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: "API key required for all requests. \nFor demonstration purposes,\
        \ you can use: `FK-TEST-API-KEY`\n"
  schemas:
    AccountInfo:
      type: object
      title: AccountInfo
      properties:
        uid:
          type: string
          description: Firebase uid of the account.
        apiKey:
          type: string
          description: The account's active API key.
        tier:
          type: string
          description: Current subscription tier (lite, single-state-pro, or pro).
        keyType:
          type: string
          description: TRIAL or PRODUCTION.
        bundledBalance:
          type: integer
          description: Remaining bundled subscription credits for the current period.
        topupBalance:
          type: integer
          description: Remaining top-up credit balance (never expires).
        bundledPeriodStart:
          type: integer
          description: Epoch milliseconds marking the start of the current bundled
            credit period.
        bundledPeriodEnd:
          type: integer
          description: Epoch milliseconds marking the end of the current bundled credit
            period.
        active:
          type: boolean
          description: Whether the account is currently active.
        adminRevoked:
          type: boolean
          description: Whether the account was revoked by an admin (as opposed to
            a self-service cancellation).
        createdAt:
          type: integer
          description: Epoch seconds when the account/API key was created.
        email:
          type: string
          description: Subscriber email address, if known.
        authorities:
          type: array
          items:
            type: string
          description: Authorisation scopes granted, e.g. FK_PRO, FK_WEB.
        pendingBundledBalance:
          type: integer
          description: "Synthesised, non-persisted field: the sum of `creditAmount`\
            \ across all PENDING BUNDLED records in the b2capi_credits ledger for\
            \ this uid \u2014 bundled credits already paid for but not yet rolled\
            \ into bundledBalance."
        pendingCreditRecords:
          type: array
          description: 'Synthesised, non-persisted field: the raw PENDING BUNDLED
            b2capi_credits ledger record(s) backing pendingBundledBalance. Compare
            pendingCreditRecords[0].tier to tier to detect a pending downgrade.'
          items:
            $ref: '#/components/schemas/PendingCreditRecord'
      required:
      - uid
      - apiKey
      - tier
      - bundledBalance
      - topupBalance
      - active
      description: A `b2capi` account record, augmented at query time with pending
        bundled-credit information derived from the b2capi_credits ledger.
    AccountKeysRequest:
      title: AccountKeysRequest
      oneOf:
      - $ref: '#/components/schemas/CreateApiKeyRequest'
      - $ref: '#/components/schemas/RevokeApiKeyRequest'
      - $ref: '#/components/schemas/GetAccountInfoRequest'
      discriminator:
        propertyName: operation
        mapping:
          createApiKey: '#/components/schemas/CreateApiKeyRequest'
          revokeApiKey: '#/components/schemas/RevokeApiKeyRequest'
          getAccountInfo: '#/components/schemas/GetAccountInfoRequest'
      description: 'Discriminated request body for POST /b2c/account/keys, selected
        by the `operation` field: `createApiKey` (CreateApiKeyRequest), `revokeApiKey`
        (RevokeApiKeyRequest), or `getAccountInfo` (GetAccountInfoRequest).'
    ApprovalRequest:
      type: object
      title: ApprovalRequest
      description: Optional request body for PUT /b2c/admin/historicaldata/{archiveId}/approval.
        Controls whether a pending self-service archive request is approved or rejected.
      properties:
        approve:
          type: boolean
          default: true
          description: 'true (or omitted) approves the request: status moves to `STARTING`
            and the build is enqueued. false rejects the request: status moves to
            `APPROVAL_REJECTED` and no build is enqueued.'
    BasicFluc:
      type: object
      title: BasicFluc
      properties:
        favourite:
          type: boolean
          description: Whether the horse was the market favourite at the time of this
            fluctuation. **Point-in-time integrity:** Locked at the scheduled race
            jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        price:
          type: number
          description: The fixed odds price at this point in time. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        time:
          type: integer
          description: Unix timestamp (milliseconds) representing the time of this
            fluctuation. **Point-in-time integrity:** Locked at the scheduled race
            jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
      required:
      - favourite
      - price
      description: A single price fluctuation entry for a horse, recording whether
        it was favourite, the price, and the time of the fluctuation.
    BenchmarkedRun:
      type: object
      title: BenchmarkedRun
      properties:
        age:
          type: integer
          description: Racing age of the horse in years, at the time of this race.
            **Point-in-time integrity:** Locked once the race is officially resulted.
            May rarely be amended by a stewards' disqualification or protest ruling
            issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        atWeights:
          type: number
          description: Form King Performance Rating for this runner, represented at
            the weight carried. **Point-in-time integrity:** Behaves like RECALCULATED
            until the record passes manual review (reviewStatus COMPLETE / trackSpeedVerified
            true), after which the value will not change for any reason unless a significant
            error is found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
        bestToteWin:
          type: number
          description: Best TAB TOTE win price across all 3 TOTEs. **Point-in-time
            integrity:** Locked once the race is officially resulted. May rarely be
            amended by a stewards' disqualification or protest ruling issued after
            the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        bsp:
          type: number
          description: Betfair Starting Price. **Point-in-time integrity:** Locked
            once the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        dataStage:
          type: string
          description: Processing stage of the data. FULL_SECTIONAL_DATA is the final
            stage of processing. **Point-in-time integrity:** Locked once the race
            is officially resulted. May rarely be amended by a stewards' disqualification
            or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        expectedRating:
          type: number
          description: A market expected rating for this runner, calculated using
            the Betfair Starting Price, as well as the Form King Likely Winning Standard.
            **Point-in-time integrity:** Behaves like RECALCULATED until the record
            passes manual review (reviewStatus COMPLETE / trackSpeedVerified true),
            after which the value will not change for any reason unless a significant
            error is found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
        finishingSpeed:
          type: number
          description: The runner's final 600m in metres per second, represented as
            a percentage of their to 600m speed in metres per second. **Point-in-time
            integrity:** Locked once the race is officially resulted. May rarely be
            amended by a stewards' disqualification or protest ruling issued after
            the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        firmOrDrift:
          type: number
          description: The amount of firm or drift in fixed odds betting from open
            to close, represented in % chance of winning and normalised for bookmaker
            percentage change and scratchings. **Point-in-time integrity:** Locked
            once the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        freezeDate:
          type: integer
          description: The point in time when this benchmark was frozen, as a UTC
            timestamp in milliseconds. Benchmarks that existed before 8 October 2026
            were retrospectively frozen and given 8 October 2026 as their freeze date,
            as this is when the concept was introduced in API version 1.1.0. **Point-in-time
            integrity:** Behaves like RECALCULATED until the record passes manual
            review (reviewStatus COMPLETE / trackSpeedVerified true), after which
            the value will not change for any reason unless a significant error is
            found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
        frozen:
          type: boolean
          description: Denotes whether this benchmark has been frozen. Once frozen,
            the FROZEN_ON_REVIEW fields on this object will not change, and the VERSIONED_ON_REVIEW
            fields will only change as a new version. Absent on benchmarks that pre-date
            freeze metadata (API v1.1.0). **Point-in-time integrity:** Behaves like
            RECALCULATED until the record passes manual review (reviewStatus COMPLETE
            / trackSpeedVerified true), after which the value will not change for
            any reason unless a significant error is found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
        meetingRunners:
          type: integer
          description: Number of runners at the meeting. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        parCreationDate:
          type: integer
          description: UTC timestamp in milliseconds. The date when the par times
            were generated to power these benchmarks. For retrospectively frozen benchmarks,
            this timestamp will be after the race occurred. **Point-in-time integrity:**
            Behaves like RECALCULATED until the record passes manual review, at which
            point the value is frozen and versioned. It may still be recalculated
            again in future, but as a new version, leaving prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        parHash:
          type: string
          description: A unique digest representing the ingredients used to make the
            par times that powered this benchmark. Used internally at Form King to
            avoid re-creating pars where no new samples exist, but handy for modellers
            to check that the par has not changed if this data is re-pulled. **Point-in-time
            integrity:** Behaves like RECALCULATED until the record passes manual
            review, at which point the value is frozen and versioned. It may still
            be recalculated again in future, but as a new version, leaving prior versions
            intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        parSamples:
          type: integer
          description: The number of historical samples for the race at this distance
            that are powering the benchmarks. For odd distances scaled from standard
            distances, this value includes both sets of samples. **Point-in-time integrity:**
            Behaves like RECALCULATED until the record passes manual review, at which
            point the value is frozen and versioned. It may still be recalculated
            again in future, but as a new version, leaving prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        pir10:
          type: integer
          description: Position in running at the 1000m marker. Will not be present
            for races < 1000m. **Point-in-time integrity:** Locked once the race is
            officially resulted. May rarely be amended by a stewards' disqualification
            or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        pir12:
          type: integer
          description: Position in running at the 1200m marker. Will not be present
            for races < 1200m. **Point-in-time integrity:** Locked once the race is
            officially resulted. May rarely be amended by a stewards' disqualification
            or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        pir2:
          type: integer
          description: Position in running at the 200m marker. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        pir4:
          type: integer
          description: Position in running at the 400m marker. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        pir6:
          type: integer
          description: Position in running at the 600m marker. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        pir8:
          type: integer
          description: Position in running at the 800m marker. Will not be present
            for races < 800m. **Point-in-time integrity:** Locked once the race is
            officially resulted. May rarely be amended by a stewards' disqualification
            or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        raceRating:
          type: number
          description: Race rating at the weights carried. Represents winning time
            as a rating, after adjustments. **Point-in-time integrity:** Locked once
            the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        raceRunners:
          type: integer
          description: Number of runners in this race. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        railMetres:
          type: number
          description: Rail position from True (0) in metres. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          example: 0.0
          x-pointInTimeStability: FROZEN_POST_RESULT
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
          description: An enum representing the status of the data review (sectionals,
            ratings) for this meeting. This is a very important flag for deciding
            how stable the data is for the future.
        reviewTimestamp:
          type: integer
          description: UTC timestamp in milliseconds. From 8 October 2026 this field
            represents the time that this benchmark moved into a reviewStatus of COMPLETE.
            Historical benchmarks that were already reviewed before then were given
            8 October 2026 as their freeze date, as this is when the concept was introduced
            in API version 1.1.0. **Point-in-time integrity:** Behaves like RECALCULATED
            until the record passes manual review (reviewStatus COMPLETE / trackSpeedVerified
            true), after which the value will not change for any reason unless a significant
            error is found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
        scaledFromDistance:
          type: integer
          description: Only set if the par times for this benchmark were created by
            scaling another standard distance's par that has more samples. For example,
            a 1206m race may be scaled from a 1200m par with more samples. **Point-in-time
            integrity:** Behaves like RECALCULATED until the record passes manual
            review, at which point the value is frozen and versioned. It may still
            be recalculated again in future, but as a new version, leaving prior versions
            intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        season:
          type: string
          description: Racing season identifier. **Point-in-time integrity:** Locked
            once the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        sections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BenchmarkedSection'
          propertyNames:
            $ref: '#/components/schemas/SectionKey'
          x-additionalPropertiesName: SectionKey
          description: "Performance metrics and rankings for all benchmarked sections\
            \ of this race. Each section has an entry keyed by its section key (e.g.\
            \ \"S-6\", \"2-F\", or \"4-2\"). Includes benchmarks vs the Form King\
            \ All Average, Class, Track benchmarks as well as versus the race field,\
            \ leader and winner times, plus race and meeting rankings within that\
            \ section if available. You can actually synthesise further data points\
            \ by combining some fields. For example, we provide vsClass and vsLeader,\
            \ but not what the field leader did vsClass. If you calculate (vsClass\
            \ \u2212 vsLeader), that will give you the field leader value against\
            \ the FK Class benchmark for that section. This method applies to vsWinner\
            \ and vsField as well, and the same can be done for All average and Track\
            \ benchmarks. **Point-in-time integrity:** Behaves like RECALCULATED until\
            \ the record passes manual review, at which point the value is frozen\
            \ and versioned. It may still be recalculated again in future, but as\
            \ a new version, leaving prior versions intact."
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        sp:
          type: number
          description: Official Starting Price. **Point-in-time integrity:** Locked
            once the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        speedRating:
          type: number
          description: Form King Speed Rating for this run. 100 represents the horse
            running to the class "par.", and these values are not tempo adjusted.
            **Point-in-time integrity:** Behaves like RECALCULATED until the record
            passes manual review, at which point the value is frozen and versioned.
            It may still be recalculated again in future, but as a new version, leaving
            prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        vsAllAvg:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King All Average benchmark. This figure is adjusted for track
            speed, but not tempo. **Point-in-time integrity:** Behaves like RECALCULATED
            until the record passes manual review, at which point the value is frozen
            and versioned. It may still be recalculated again in future, but as a
            new version, leaving prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        vsClass:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King Class benchmark. This figure is adjusted for track speed,
            but not tempo. **Point-in-time integrity:** Behaves like RECALCULATED
            until the record passes manual review, at which point the value is frozen
            and versioned. It may still be recalculated again in future, but as a
            new version, leaving prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        vsTrack:
          type: number
          description: Overall time performance for this runner, represented in lengths
            +/- the Form King Track benchmark. This figure is adjusted for track speed,
            but not tempo. **Point-in-time integrity:** Behaves like RECALCULATED
            until the record passes manual review, at which point the value is frozen
            and versioned. It may still be recalculated again in future, but as a
            new version, leaving prior versions intact.
          x-pointInTimeStability: VERSIONED_ON_REVIEW
        warningScore:
          type: number
          description: A points score assigned to the meeting based on the amount
            of uncertainty/discrepancy in the timing and rating data. A value of 1
            or less is considered low risk and would qualify for a computer Auto Review.
            **Point-in-time integrity:** Locked once the race is officially resulted.
            May rarely be amended by a stewards' disqualification or protest ruling
            issued after the meeting.
          x-pointInTimeStability: FROZEN_POST_RESULT
        wfaRat:
          type: number
          description: Form King Performance Rating for this runner, adjusted to the
            runner's Weight For Age allocation (see also wfaDiff). **Point-in-time
            integrity:** Behaves like RECALCULATED until the record passes manual
            review (reviewStatus COMPLETE / trackSpeedVerified true), after which
            the value will not change for any reason unless a significant error is
            found.
          x-pointInTimeStability: FROZEN_ON_REVIEW
