          x-pointInTimeStability: FROZEN_PRE_RACE
        going:
          type: string
          description: Track condition description. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: Heavy
          x-pointInTimeStability: FROZEN_PRE_RACE
        goingNumber:
          type: integer
          description: Numeric track condition value. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          example: 10
          x-pointInTimeStability: FROZEN_PRE_RACE
        lws:
          type: number
          description: The Likely Winning Standard value shown in the Form Guide,
            representing the computer's pre-race guess of the strength of this race,
            at the weights carried on the Form King scale. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        name:
          type: string
          description: Full name of the race. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: Western Corporate Project Management Mdn
          x-pointInTimeStability: FROZEN_PRE_RACE
        nightMeeting:
          type: boolean
          description: Whether this is a night meeting. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        number:
