            once the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          example: 57.0
          x-pointInTimeStability: FROZEN_POST_RESULT
        weightForAgeRating:
          type: number
          description: The Form King performance rating achieved in this race, adjusted
            to the horse's WFA allocation on that date. **Point-in-time integrity:**
            Locked once the race is officially resulted. May rarely be amended by
            a stewards' disqualification or protest ruling issued after the meeting.
          example: 91.73080057898598
          x-pointInTimeStability: FROZEN_POST_RESULT
        wfaDiff:
          type: number
          description: Difference in kilograms from the Form King Weight For Age allocation
            at the time of this race. We use a modified version of the Standard WFA
            scale. **Point-in-time integrity:** Locked once the race is officially
            resulted. May rarely be amended by a stewards' disqualification or protest
            ruling issued after the meeting.
          example: 10.629740151899995
          x-pointInTimeStability: FROZEN_POST_RESULT
      required:
      - barrier
      - date
      - daysSincePreviousRace
      - distance
      - gear
      - raceNumber
      - ratingScale
      - tabMeeting
      - trackSpeed
      - trackSpeedVerified
      description: A single past race, trial, scratching or spell entry for a horse.
        May contain benchmarking data, if available and authorised.
    PendingCreditRecord:
      type: object
      title: PendingCreditRecord
      properties:
        uid:
          type: string
          description: Firebase uid the record belongs to.
        invoiceNo:
          type: string
          description: Xero invoice number that generated this record (idempotency
            key together with uid).
        invoiceId:
          type: string
          description: Xero invoice UUID.
        type:
          type: string
          description: BUNDLED or TOPUP.
        status:
          type: string
          description: PENDING, CONSUMED, or CANCELLED.
        creditAmount:
          type: integer
          description: Number of credits this record represents.
        sku:
          type: string
          description: Product SKU the invoice line item was for.
        tier:
          type: string
          description: Subscription tier this record applies to (BUNDLED records only).
        bundledPeriodStart:
          type: integer
          description: Epoch milliseconds marking when this record's period becomes
            active.
        bundledPeriodEnd:
          type: integer
          description: Epoch milliseconds marking when this record's period ends.
      required:
      - uid
      - invoiceNo
      - type
      - status
      - creditAmount
      description: A single PENDING (or otherwise) entry from the b2capi_credits ledger,
        representing a credit allocation tied to one invoice.
    Placing:
      type: object
      title: Placing
      properties:
        barrier:
