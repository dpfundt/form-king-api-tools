        status:
          type: string
          description: PENDING, CONSUMED, or CANCELLED.
        creditAmount:
          type: integer
          description: Number of credits this record represents.
        sku:
          type: string
          description: Product SKU the invoice line item was for.
        tier:
          type: string
          description: Subscription tier this record applies to (BUNDLED records only).
        bundledPeriodStart:
          type: integer
          description: Epoch milliseconds marking when this record's period becomes
            active.
        bundledPeriodEnd:
          type: integer
          description: Epoch milliseconds marking when this record's period ends.
      required:
      - uid
      - invoiceNo
      - type
      - status
      - creditAmount
      description: A single PENDING (or otherwise) entry from the b2capi_credits ledger,
        representing a credit allocation tied to one invoice.
    Placing:
      type: object
      title: Placing
      properties:
        barrier:
          type: integer
          description: Actual barrier jumped from.
          example: 5
        finishPosition:
          type: integer
          description: Official finishing position.
          example: 1
        finishPositionDisplay:
          type: string
          description: Display string for finishing position.
          example: 1st
        horse:
          type: string
          description: Name of the horse.
          example: Obambulate
        jockey:
          type: string
          description: Name of the jockey.
          example: Craig Williams
        margin:
          type: number
          description: Margin from the winner.
        thisHorse:
          type: boolean
          description: Boolean indicating if this placing is the subject horse.
        weight:
          type: number
          description: Weight carried.
          example: 58.0
      required:
      - barrier
      - finishPosition
      - finishPositionDisplay
      - horse
      - jockey
      - margin
      - thisHorse
      - weight
      description: Used in PastEvent records to represent the top few finishers in
        a race. Contains only basic runner and result information.
    RaceEntry:
      type: object
      title: RaceEntry
      properties:
        acceptances:
          type: array
          items:
            $ref: '#/components/schemas/DualAcceptance'
          description: Details of multiple race acceptances. Handy for dual acceptors.
        apprenticeClaim:
          type: number
          description: Weight allowance for the apprentice jockey. In non-claiming
            races, this can be 0 even if the jockey would otherwise have a claim.
        apprenticeJockey:
          type: boolean
          description: Boolean indicating if an apprentice is riding this horse.
        averagePrizeMoney:
          type: number
          description: Average prize money earned per start for this horse.
          example: 20500.0
        barrier:
          type: integer
          description: Balloted starting gate position. Note - scratchings may affect
            the actual barrier jumped from.
          example: 1
        benchmarkRating:
          type: number
          description: Official Handicap Rating (OHR) assigned to the horse prior
            to this race.
        breedingId:
          type: string
          description: Form King unique identifier for this horse.
          example: 2022_exceed-and-excel_wayborn
        daysSinceLastRace:
          type: integer
          description: Days elapsed since the horse's previous race, taken from the
            race date.
          example: 143
        daysSinceLastWin:
          type: integer
          description: Days elapsed since the horse's last victory, taken from the
            race date.
        distanceChange:
          type: string
          description: Change in distance from the previous race.
        dualAcceptor:
          type: boolean
          description: Boolean indicating if the horse is accepted in multiple upcoming/recent
            races. If this is true, the details will be in the "acceptances" data
            field.
        emergency:
          type: boolean
          description: Boolean indicating if the horse is an emergency runner.
        firstStarter:
          type: boolean
          description: Boolean indicating if the horse is having its first ever race
            start.
        form:
          $ref: '#/components/schemas/Form'
          description: Performance statistics for this horse across various conditions
            and race types.
        gear:
          type: array
          items:
            $ref: '#/components/schemas/Gear'
          description: Current gear being worn by the horse.
        gearChanges:
          type: string
          description: Changes in this runner's applied gear for this race.
          example: 'Gelded '
        homeTrack:
          type: string
          description: String indicating the track code of the horse's home track
            (derived from Horse::trainingLocation)
          example: FLEM
        horse:
          $ref: '#/components/schemas/Horse'
          description: The horse breeding, ownership and other relevant details.
        horseResult:
          $ref: '#/components/schemas/HorseResult'
          description: Result data for this horse. Available once the race has been
            resulted, which is typically within 15 minutes after the race has finished.
        jockey:
          type: string
          description: Full name of the jockey.
          example: Rocky Cheung
        jockeyForm:
          $ref: '#/components/schemas/JockeyForm'
          description: Performance statistics for the jockey riding this horse.
        jockeysOnlyRideAtMeeting:
          type: boolean
          description: Boolean indicating if the jockey has no other rides at the
            meeting.
        metadata:
          $ref: '#/components/schemas/RaceEntryMetadata'
          description: Additional metadata for this entry, including peak ratings.
        number:
          type: integer
          description: Saddlecloth (TAB) number for this entry.
          example: 9
        odds:
          $ref: '#/components/schemas/RaceEntryOdds'
          description: Live market odds information for this entry. Only present if
            an odds market has been obtained from our provider; data can be up to
            15 minutes delayed.
        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/PastEvent'
          description: Past form for this horse, including weight-adjusted and WFA
            ratings, and optionally benchmarking data. Depth depends on user subscription
            tier and API being called.
        raceEntryId:
          type: string
          description: Unique Form King identifier for the race entry, comprised of
            raceId and saddlecloth number.
          example: PAKM_150526_1_1
        raceInPrep:
          type: integer
          description: The run number within the current preparation. A preparation/spell
            boundary in Form King is 80 days.
          example: 1
        ratings:
          $ref: '#/components/schemas/RaceEntryRatings'
          description: A convenience object containing Form King ratings for this
            entry, including the Neural rating and Market Expected rating (when odds
            are available).
        recentTrials:
          type: array
          items:
            $ref: '#/components/schemas/PastEvent'
          description: Recent barrier trial results for this horse. A trial is present
            here if it has occurred since the last race or 80+ day spell.
        ridingWeight:
          type: number
          description: Weight in kilograms that the jockey is expected to ride at.
            This is the value stored in the Racing Australia system.
          example: 55.0
        scratched:
          type: boolean
          description: Boolean indicating if the horse has been officially withdrawn
            from the race.
        totalPrizeMoney:
          type: number
          description: Total career prize money earned by this horse, prior to the
            race taking place.
          example: 41000.0
        trackSpeedGoingForm:
          $ref: '#/components/schemas/GoingForm'
          description: Summarises win/place record for each FK Track Speed category.
            This makes for a more accurate and complete view of form across different
            track grades than the official goingForm data.
        trainer:
          type: string
          description: Full name of the trainer or training partnership.
          example: Jonathon Jachmann
        trainerForm:
          $ref: '#/components/schemas/TrainerForm'
          description: Performance statistics for the trainer of this horse.
        trainersOnlyRaceAtMeeting:
          type: boolean
          description: Boolean indicating if the trainer has no other runners at the
            meeting.
        weight:
          type: number
          description: Weight (in kilograms) assigned to the entry for the race. To
            determine weight carried, you need to incorporate the apprenticeClaim
            and ridingWeight fields.
          example: 58.0
        weightCarried:
          type: number
          description: Actual weight carried in kilograms, including jockey and gear.
          example: 58.0
        wfaDiff:
          type: number
          description: Difference in kilograms from the Form King Weight For Age allocation
            at the time of this race. We use a modified version of the Standard WFA
            scale.
          example: 10.082462134299995
      required:
      - barrier
      - horse
      - number
      - scratched
      - trainer
      description: A runner entry found in race/meeting summary responses, containing
        the full form details for this runner in the relevant race. If subscription
        tier allows, this can be populated with full career form and benchmarking
        data.
    RaceEntryLite:
      type: object
      title: RaceEntryLite
      properties:
        barrier:
          type: integer
          description: Barrier drawn for this runner.
          example: 1
        horse:
          $ref: '#/components/schemas/HorseLite'
          description: Basic horse details including name, sire and dam.
        jockey:
          type: string
          description: Name of the jockey.
          example: Rocky Cheung
        number:
          type: integer
          description: Saddlecloth/runner number.
          example: 9
        scratched:
          type: boolean
          description: Whether this runner has been scratched.
        trainer:
          type: string
          description: Name of the trainer.
          example: Jonathon Jachmann
      required:
      - barrier
      - horse
      - number
      - scratched
      - trainer
      description: A lightweight runner entry for use in meeting summary lite responses,
        containing only the key identification and status fields.
    RaceEntryMetadata:
      type: object
      title: RaceEntryMetadata
      properties:
        peakRatings:
          type: array
          items:
            $ref: '#/components/schemas/PeakRating'
          description: Collection of peak ratings achieved by the horse. This field
            has been deprecated in favour of RaceEntry::ratings.
          deprecated: true
      required: []
      description: Contains auxiliary metadata about the RaceEntry item. At the moment,
        peakRatings is the only information contained within.
    RaceEntryOdds:
      type: object
      title: RaceEntryOdds
      properties:
        avgNow:
          type: number
          description: The average corporate bookmaker price at the time of the most
            recent fluctuation. See 'timestamp' for when this fluc occurred.
        avgOpen:
          type: number
          description: The average corporate bookmaker price at market open, which
            is typically around 15-20 minutes after the TAB market opens. As such,
            some artificially high TAB open prices are not included as they've already
            been knocked off by this point.
        bestBookies:
          type: array
          items:
            type: string
          description: A list of lowercase bookmaker names that are currently offering
            the best price (from Betwatch's bookmakerLower field).
        bestNow:
          type: number
          description: The best corporate bookmaker price at the time of the most
            recent fluctuation. See 'timestamp' for when this fluc occurred.
        firmOrDrift:
          type: number
          description: The % change in the market's opinion of this runner since open.
            A value of -5 would mean that the runner has drifted by 5% chance of winning
            (say from $4 - a 25% chance to $5 - a 20% chance). This value is normalised
            for bookmaker % change and scratchings, making it a great indicator of
            where money is (or isn't) being placed.
        timestamp:
          type: integer
          description: The time of the latest fluctuation, as a Unix timestamp in
            UTC (milliseconds since Epoch).
      required:
      - avgNow
      - avgOpen
      - bestBookies
      - bestNow
      - firmOrDrift
      - timestamp
      description: An object containing basic live market odds information for the
        RaceEntry. This field will only be present if we have obtained an odds market
        from our provider, and the data contained within can be up to 15 minutes delayed
        from the live odds.
    RaceEntryRatings:
      type: object
      title: RaceEntryRatings
      properties:
        exp:
          type: number
          description: The runner's market expected rating on the Form King scale.
            This value is calculated from the market opinion, using the RaceEntry::odds::bestNow
            value, and the Race::lws (likely winning standard) and Race::expAdj value,
            which helps frame the expected rating nicely within past ratings for today's
            race.
        neural:
          type: number
          description: The Form King Neural rating. This is not a measure of performance,
            rather a collection of points awarded to runners based on traditional
            form and statistics. It includes jockey, trainer, track, distance, beaten
            margin and other similar items.
        peak:
          type: number
          description: The runner's career peak rating on the Form King scale, adjusted
            to weight carried today.
        peak12m:
          type: number
          description: The runner's 12 month peak rating on the Form King scale, adjusted
            to weight carried today.
      required: []
      description: A convenience object that contains a series of ratings for the
        RaceEntry in today's race. Contains the Form King Neural Rating, and the Market
        Expected Rating (EXP, when odds market is available).
    RaceLite:
      type: object
      title: RaceLite
      properties:
        distance:
          type: integer
          description: Race distance in metres.
          example: 1100
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RaceEntryLite'
          description: List of runners in this race with basic details.
        going:
          type: string
          description: Track condition description.
          example: Heavy
        goingNumber:
          type: integer
          description: Numeric track condition value.
          example: 10
        lws:
          type: number
          description: The Likely Winning Standard value shown in the Form Guide,
            representing the computer's guess of the strength of this race.
        name:
          type: string
          description: Full name of the race.
          example: Western Corporate Project Management Mdn
        nightMeeting:
          type: boolean
          description: Whether this is a night meeting.
        number:
          type: integer
          description: Race number on the card.
          example: 1
        prizemoneyGrade:
          type: string
          description: Prizemoney grade classification.
          example: P
        raceId:
          type: string
          description: Unique identifier for this race.
          example: ABNY_150526_1
        raceType:
          type: string
          description: Type of race (e.g., Flat, Hurdle).
          example: Flat
        restrictions:
          type: string
          description: Age or gender restrictions for this race.
          example: MDN.2+..S
        status:
          type: string
          description: Current status of the race (e.g., OPEN, CLOSED, FINAL).
          example: FINAL_FIELDS
        totalPrizeMoney:
          type: number
          description: Total prize money for this race.
          example: 19600.0
        trackCode:
          type: string
          description: Four-character track code.
          example: ABNY
      required:
      - distance
      - entries
      - going
      - goingNumber
      - name
      - nightMeeting
      - number
      - prizemoneyGrade
      - raceId
      - raceType
      - restrictions
      - status
      - totalPrizeMoney
      - trackCode
      description: A lightweight race summary for use in meeting summary lite responses,
        containing race details and a list of lite runner entries.
    RaceSummary:
      type: object
      properties:
        date:
          type: integer
          description: Race date as a Unix timestamp (milliseconds since Epoch).
          example: 1778819100000
        direction:
          type: string
          description: The direction of racing (CLOCKWISE, ANTICLOCKWISE).
          example: ANTICLOCKWISE
        distance:
          type: integer
          description: Official race distance in metres.
          example: 1100
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RaceEntry'
          description: List of entries (runners) in this race, enriched with horse
            profile data where available.
        expAdj:
          type: number
          description: A uniform adjustment applied to every runner's raw EXP rating,
            to help frame the EXP more accurately in competitive fields.
        fieldStrength:
          type: number
          description: Calculated strength of the field. This value has been deprecated
            in favour of lws (Likely Winning Standard).
          example: 55.0
          deprecated: true
        going:
          type: string
          description: Official track condition for this specific race (e.g. Synthetic,
            Dirt, Fast, Good, Dead, Slow, Heavy).
          example: Heavy
        goingNumber:
          type: integer
          description: Numeric value representing the official track condition.
          example: 10
        lastUpdated:
          type: integer
          description: Unix timestamp in milliseconds (UTC) representing the data
            update timestamp for this specific race.
          example: 1778835962723
        lws:
          type: number
          description: The Likely Winning Standard value shown in the Form Guide,
            representing the computer's guess of the strength of this race.
        meetingId:
          type: string
        name:
          type: string
          description: The name of the race.
          example: Western Corporate Project Management Mdn
        nightMeeting:
          type: boolean
          description: Boolean indicating whether the meeting is being run at night.
        nomsRaceNo:
          type: integer
          description: Race numbers almost always change from NOMINATIONS/WEIGHTS
            stage to FINAL_FIELDS. This is a handy reference back to the pre-acceptances
            race number.
        numRunners:
          type: integer
          description: Number of runners in the race.
          example: 10
        number:
          type: integer
          description: The race number on the card.
          example: 1
        prizemoneyGrade:
          type: string
          description: Grade/category of the race, based on prizemoney. Possible values
            are N (Non-TAB), C (Country), P (Provincial), MMW (Metro Midweek), MSAT
            (Metro Saturday).
          example: P
        raceId:
          type: string
          description: Form King unique identifier for the race.
          example: ABNY_150526_1
        raceType:
          type: string
          description: Type of race (e.g., Flat, Hurdle, Steeple).
          example: Flat
        railPosition:
          type: string
          description: Textual description of the rail placement, including cutaway
            or variable information.
          example: Out 3m Entire Circuit
        restrictions:
          type: string
          description: A string containing class, age, gender and weight restrictions
            for the race.
          example: MDN.2+..S
        stageId:
          type: string
          deprecated: true
        startTime:
          type: string
          description: Scheduled start time as a string.
          example: 12:25pm
        status:
          type: string
          description: Status of the race (e.g., NOMINATIONS, WEIGHTS, FINAL_FIELDS,
            INTERIM_RESULTS, RESULTED, ABANDONED).
          example: FINAL_FIELDS
        syntheticHold:
          type: number
          description: A decimal value representing the combined market percentage
            of the best odds across all supported bookmakers. A 120% synthetic hold
            would be represented as 1.2. Multiply by 100 to get the market %. Only
            present when odds are available.
        tabMeeting:
          type: boolean
          description: Indicates whether the meeting is graded as TAB professional
            or not.
          example: true
        totalPrizeMoney:
          type: number
          description: Total prize money pool for the race in Australian dollars (AUD),
            less any contribution to the Jockeys Trust or other charity.
          example: 19600.0
        trackCode:
          type: string
          description: The 4 character track code for the circuit that this race is
            being run on.
          example: ABNY
        trackName:
          type: string
          description: Display name of the track hosting the meeting.
          example: Albany
      required:
      - distance
      - entries
      - going
      - goingNumber
      - name
      - nightMeeting
      - number
      - prizemoneyGrade
      - raceId
      - raceType
      - restrictions
      - status
      - totalPrizeMoney
      - trackCode
      description: A detailed summary of a single race, including all runner information.
        Each entry can be enriched with the horse's benchmark ratings and full past
        form history from their horse profile. Data depth will depend on subscription
        level.
      title: RaceSummary
    RevokeApiKeyRequest:
      type: object
      title: RevokeApiKeyRequest
      properties:
        operation:
          type: string
          enum:
          - revokeApiKey
        uid:
          type: string
          description: Firebase uid of the account to revoke.
        apiKey:
          type: string
          description: "Alternative to uid \u2014 the API key of the account to revoke."
      required:
      - operation
      description: 'Request body for `operation: revokeApiKey` on POST /b2c/account/keys.
        Revokes the caller''s own API key and cancels any PENDING bundled ledger records.'
    RevokeApiKeyResponse:
      type: object
      title: RevokeApiKeyResponse
      properties:
        uid:
          type: string
        active:
          type: boolean
        adminRevoked:
          type: boolean
        adminRevokedAt:
          type: integer
          description: Present only when revoked by an admin.
      required:
      - uid
      - active
      - adminRevoked
      description: Response body confirming an API key revocation, including whether
        it was an admin revoke or a self-service cancellation.
    SectionKey:
      type: string
      enum:
      - S-12
      - S-10
      - S-8
      - S-6
      - S-4
      - S-2
      - 12-10
      - 10-8
      - 8-6
      - 6-4
      - 4-2
      - 8-4
      - 8-2
      - 12-F
      - 10-F
      - 8-F
      - 6-F
      - 4-F
      - 2-F
      title: SectionKey
      description: A unique key representing a specific section of a race (e.g., 'S-6'
        for Start to 600m, '12-F' for Last 1200m).
    SelfServiceHistoricalDataRequest:
      type: object
      title: SelfServiceHistoricalDataRequest
      properties:
        from:
          type: string
          pattern: ^\d{6}$
          description: Inclusive start date in DDMMYY format (e.g. `010725` for 1
            July 2025). Optional if `dates` is supplied, in which case it is ignored.
        to:
          type: string
          pattern: ^\d{6}$
          description: Inclusive end date in DDMMYY format. Must be greater than or
            equal to `from`. Optional if `dates` is supplied, in which case it is
            ignored.
        dates:
          type: string
          description: Optional CSV of up to 10 explicit DDMMYY dates (e.g. `120725,240826`).
            When supplied, overrides `from`/`to` for day selection; effective `from`/`to`
            for the archive filename and progress display are computed as min/max
            of `dates`. More than 10 values returns a 400 error.
        numBenchmarks:
          type: integer
          enum:
          - 5
          - 10
          description: Number of benchmarked past runs to include per runner. Exactly
            5 or 10.
        states:
          type: string
          description: Optional CSV of Australian state codes to include (VIC,NSW,ACT,QLD,NT,WA,SA,TAS).
            Omit or empty for all states.
        message:
          type: string
          maxLength: 1000
          description: Optional free-text use-case description, up to 1000 characters,
            explaining why this archive is being requested. Shown to the admin reviewing
            the pending approval, and echoed back in every subsequent progress/list/approval
            response.
      required:
      - numBenchmarks
      description: "Request body for POST /b2c/account/historicaldata. Same as HistoricalDataRequest,\
        \ minus `uid` \u2014 your own uid is always used, resolved from your API key\
        \ or Firebase JWT. Either `dates` (up to 10 explicit DDMMYY values) or both\
        \ `from` and `to` (an inclusive DDMMYY range) must be supplied. The resulting\
        \ archive is not built immediately; it is queued for admin approval (status\
        \ `APPROVAL_REQUIRED`). An optional `message` field (up to 1000 characters)\
        \ lets you describe your use case for the admin reviewing the request."
    Speedmap:
      type: object
      title: Speedmap
      properties:
        custom:
          type: boolean
          description: Whether this speedmap has been manually customised by a Form
            King user. Defaults to false for all owner="formking" default maps.
        direction:
          type: string
          description: The running direction of the race (e.g. CLOCKWISE, ANTI_CLOCKWISE).
          example: CLOCKWISE
        entries:
          type: array
          items:
            $ref: '#/components/schemas/SpeedmapEntry'
          description: List of per-runner SpeedmapEntry items, one per runner in the
            race.
        expectedTempo:
          $ref: '#/components/schemas/ExpectedTempo'
          description: An object containing the expected race tempo, including a single
            description, min/max pace category and values.
        owner:
          type: string
          description: The source or owner of this speedmap (e.g. "formking", or if
            owned by a user, their UID value).
          example: formking
        raceId:
          type: string
          description: Unique Form King identifier for the race that this speedmap
            belongs to.
          example: NCLE_120326_1
      required:
      - custom
      - direction
      - entries
      - owner
      - raceId
      description: A speed map for a single race, containing early speed metrics,
        expected tempo and a list of per-runner SpeedmapEntry items. The owner field
        identifies the source of the speedmap (e.g. 'formking', or a Form King user's
        UID).
    SpeedmapEntry:
      type: object
      title: SpeedmapEntry
      properties:
        barrier:
          type: integer
          description: Barrier number drawn for this runner.
          example: 1
        breedingId:
          type: string
          description: Form King unique horse identifier for this race entry.
          example: 2022_exceed-and-excel_wayborn
        daysSinceLastRace:
          type: integer
          description: Number of days since this horse last raced.
          example: 143
        distanceChange:
          type: integer
          description: Change in race distance compared to the horse's last start,
            in metres. Positive is up in distance this start.
        earlySpeedValues:
          $ref: '#/components/schemas/EarlySpeedMetrics'
          description: Detailed breakdown of the early speed score, including lengths
            from leader, lengths vs benchmark, overall score and position in run.
        emergency:
          type: boolean
          description: Whether this runner is an emergency (reserve) entry.
        gridX:
          type: integer
          description: Used only for custom user maps. The grid position on the X
            axis for this runner tile.
          example: 9
        gridY:
          type: integer
          description: Used only for custom user maps. The grid position on the Y
            axis for this runner tile.
        horse:
          type: string
          description: Name of the horse.
          example: Twoexcel
        locked:
          type: boolean
          description: Whether this entry has been manually locked in the X,Y speedmap
            grid position by the user. Not used in default Form King maps. See also
            gridX and gridY.
        medianEarlyVsBenchmark:
          type: number
          description: The median early speed vs the Form King benchmark for this
            runner, expressed in lengths. Positive is above (faster than) par.
          example: -3.6944527928043174
        number:
          type: integer
          description: Saddle cloth number for this runner.
          example: 9
        runInPrep:
          type: integer
          description: Run number within the current preparation.
          example: 1
      required:
      - barrier
      - breedingId
      - daysSinceLastRace
      - distanceChange
      - emergency
      - horse
      - locked
      - number
      - runInPrep
      description: A single runner entry within a Speedmap, containing their Form
        King default early speed value, detailed early speed metrics, and various
        other details. The data in each SpeedmapEntry for a formking-owned map should
        match the Form King Form Guide's Speedmap display.
    TrainerForm:
      type: object
      title: TrainerForm
      properties:
        horseComboForm:
          type: string
          description: Performance history of this trainer/horse combination.
          example: 2:0-0-1
        jockeyComboForm:
          type: string
          description: Performance history of this trainer/jockey combination.
          example: 0:0-0-0
        jockeyComboWinPercentage:
          type: number
          description: Win percentage for this trainer/jockey combination.
        lastTwelveMonthForm:
          type: string
          description: Trainer's overall performance over the last 12 months.
          example: 481:93-62-64
        lastTwelveMonthWinPercentage:
          type: number
          description: Trainer's win percentage over the last 12 months.
          example: 19.334719334719335
        trackComboForm:
          type: string
          description: Performance history of this trainer at this track.
          example: 0:0-0-0
        trackComboWinPercentage:
          type: number
          description: Win percentage for this trainer at this track.
      required:
      - horseComboForm
      - jockeyComboForm
      - jockeyComboWinPercentage
      - lastTwelveMonthForm
      - lastTwelveMonthWinPercentage
      - trackComboForm
      - trackComboWinPercentage
      description: Contains statistical information about a trainer's recent performance.
    UsageLogItem:
      type: object
      title: UsageLogItem
      properties:
        bundledUsed:
          type: integer
          description: Number of bundled subscription credits used.
        creditsDeducted:
          type: integer
          description: Total credits deducted for this API call.
        metadata:
          $ref: '#/components/schemas/UsageMetadata'
          description: Optional key-value metadata associated with the request (e.g.
            meetingId, raceId, horseId).
        mode:
          type: string
          description: Credit deduction mode (USED or REPORTING).
        operation:
          type: string
          description: API operation or route invoked (e.g. get_race_form, get_meeting_summary).
        requestId:
          type: string
          description: Unique identifier for the API request.
        sk:
          type: string
          description: Sort key in the usage log table (timestamp#requestId).
        timestamp:
          type: string
          description: ISO 8601 UTC timestamp of the API call.
        topupUsed:
          type: integer
          description: Number of top-up credits used.
        uid:
          type: string
          description: Unique identifier of the user account.
        version:
          type: number
          description: Usage log schema version (e.g. 2.0).
      required:
      - bundledUsed
      - creditsDeducted
      - operation
      - requestId
      - timestamp
      - uid
      description: A single API request credit usage log entry recorded by the B2C
        API.
    UsageMetadata:
      type: object
      title: UsageMetadata
      properties:
        callType:
          type: string
          description: Sub-type or context of the call, if applicable.
        horseId:
          type: string
          description: Horse ID associated with the API call, if applicable.
        meetingId:
          type: string
          description: Meeting ID associated with the API call, if applicable.
          example: ABNY_150526
        raceId:
          type: string
          description: Race ID associated with the API call, if applicable.
      required: []
      description: Contextual request parameters and metadata captured during API
        invocation.
    UsageOperationSummary:
      type: object
      title: UsageOperationSummary
      properties:
        calls:
          type: integer
          description: Total number of API calls for this operation.
        credits:
          type: integer
          description: Total credits deducted for this operation.
      required:
      - calls
      - credits
      description: Breakdown of call counts and total credits deducted for a specific
        API operation.
  parameters:
    FormatParam:
      name: format
      in: query
      required: false
      description: Response format. Defaults to `json`. Set to `csv` to receive a
        CSV file instead.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    FlattenParam:
      name: flatten
      in: query
      required: false
      description: "Controls the flattening level when `format=csv`. `entry` (default)\
        \ \u2014 one row per entry with `meeting_*` and `race_*` columns prepended;\
        \ `race` \u2014 one row per race with `meeting_*` columns prepended; `meeting`\
        \ \u2014 one row per meeting (fully flattened)."
      schema:
        type: string
        enum:
        - entry
        - race
        - meeting
        default: entry
    VersionParam:
      name: version
      in: query
      required: false
      description: API projection version. Currently only `v1` is supported.
      schema:
        type: string
        enum:
        - v1
        default: v1
security:
- ApiKeyAuth: []
tags:
- name: Meetings
  description: Endpoints for retrieving horse racing meeting information, including
    upcoming meetings and full meeting summaries.
- name: Races
  description: Endpoints for retrieving detailed race information, including runner
    form enriched with horse profile data.
- name: Horses
  description: Endpoints for retrieving individual horse form profiles, including
    past events and benchmarked sectional data.
- name: Account
  description: Endpoints for account management, usage logging, and subscription self-service.
