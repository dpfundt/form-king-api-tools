              schema:
                $ref: '#/components/schemas/HistoricalDataResponse'
        '400':
          description: Bad request (invalid or missing parameters)
        '401':
          description: "Unauthorized \u2014 missing or invalid credentials"
        '403':
          description: "Forbidden \u2014 access denied"
        '404':
          description: Not found
        '409':
          description: Conflict (e.g. balance adjustment would go negative)
        '500':
          description: Internal server error
        '503':
          description: "Service Unavailable \u2014 unable to resolve product/tier\
            \ configuration"
      description: 'Requests a password-protected historical data archive for your
        own account. Your `uid` is always resolved from your API key or Firebase JWT;
        it is never read from the request body. Unlike the admin endpoint, this does
        not queue the build immediately: it writes a progress sidecar with status
        `APPROVAL_REQUIRED` and returns 202 with the initial progress JSON (including
        the archive password); an admin must approve the request (best-effort notified
        by email) before the build is queued. Optionally accepts a `message` field
        (up to 1000 characters) describing your use case, included in the admin notification
        email and echoed back in every subsequent progress/list/approval response.
        Poll GET /b2c/account/historicaldata/{archiveId} to track the status as it
        moves from `APPROVAL_REQUIRED` to `STARTING` to `IN_PROGRESS` to `COMPLETE`.
        Returns 404 if your account is not found or inactive.'
      summary: Request My Historical Data Archive
      tags:
      - Account
      requestBody:
        required: true
        content:
          application/json:
