            never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        apprenticeClaim:
          type: number
          description: Weight allowance for the apprentice jockey. In non-claiming
            races, this can be 0 even if the jockey would otherwise have a claim.
            **Point-in-time integrity:** Locked at the scheduled race jump time and
            never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        apprenticeJockey:
          type: boolean
          description: Boolean indicating if an apprentice is riding this horse. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        averagePrizeMoney:
          type: number
          description: Average prize money earned per start for this horse. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          example: 20500.0
          x-pointInTimeStability: FROZEN_PRE_RACE
        barrier:
          type: integer
          description: Balloted starting gate position. Note - scratchings may affect
            the actual barrier jumped from. **Point-in-time integrity:** Locked at
            the scheduled race jump time and never rewritten afterwards.
          example: 1
          x-pointInTimeStability: FROZEN_PRE_RACE
        benchmarkRating:
          type: number
          description: Official Handicap Rating (OHR) assigned to the horse prior
            to this race. **Point-in-time integrity:** Locked at the scheduled race
            jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        breedingId:
          type: string
          description: Form King unique identifier for this horse. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          example: 2022_exceed-and-excel_wayborn
          x-pointInTimeStability: FROZEN_PRE_RACE
        daysSinceLastRace:
          type: integer
          description: Days elapsed since the horse's previous race, taken from the
            race date. **Point-in-time integrity:** Locked at the scheduled race jump
            time and never rewritten afterwards.
          example: 143
          x-pointInTimeStability: FROZEN_PRE_RACE
        daysSinceLastWin:
          type: integer
          description: Days elapsed since the horse's last victory, taken from the
            race date. **Point-in-time integrity:** Locked at the scheduled race jump
            time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        distanceChange:
          type: string
          description: Change in distance from the previous race. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        dualAcceptor:
          type: boolean
          description: Boolean indicating if the horse is accepted in multiple upcoming/recent
            races. If this is true, the details will be in the "acceptances" data
            field. **Point-in-time integrity:** Locked at the scheduled race jump
            time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        emergency:
          type: boolean
          description: Boolean indicating if the horse is an emergency runner. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        firstStarter:
          type: boolean
          description: Boolean indicating if the horse is having its first ever race
            start. **Point-in-time integrity:** Locked at the scheduled race jump
            time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        form:
          $ref: '#/components/schemas/Form'
          description: Performance statistics for this horse across various conditions
            and race types.
        gear:
          type: array
          items:
            $ref: '#/components/schemas/Gear'
          description: Current gear being worn by the horse. **Point-in-time integrity:**
            Locked at the scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        gearChanges:
          type: string
          description: Changes in this runner's applied gear for this race. **Point-in-time
            integrity:** Locked at the scheduled race jump time and never rewritten
            afterwards.
          example: 'Gelded '
          x-pointInTimeStability: FROZEN_PRE_RACE
        homeTrack:
          type: string
          description: String indicating the track code of the horse's home track
            (derived from Horse::trainingLocation) **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: FLEM
          x-pointInTimeStability: FROZEN_PRE_RACE
        horse:
          $ref: '#/components/schemas/Horse'
          description: The horse breeding, ownership and other relevant details.
        horseResult:
          $ref: '#/components/schemas/HorseResult'
          description: Result data for this horse. Available once the race has been
            resulted, which is typically within 15 minutes after the race has finished.
        jockey:
          type: string
          description: Full name of the jockey. **Point-in-time integrity:** Locked
            at the scheduled race jump time and never rewritten afterwards.
          example: Rocky Cheung
          x-pointInTimeStability: FROZEN_PRE_RACE
        jockeyForm:
          $ref: '#/components/schemas/JockeyForm'
          description: Performance statistics for the jockey riding this horse.
        jockeysOnlyRideAtMeeting:
          type: boolean
          description: Boolean indicating if the jockey has no other rides at the
            meeting. **Point-in-time integrity:** Locked at the scheduled race jump
