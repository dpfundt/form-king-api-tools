        schema:
          type: boolean
          default: false
      - name: numPastRaces
        in: query
        required: false
        description: Truncates `pastEvents` once this many race-type events (where
          `race == true`) have been included. Applied after `racesOnly`. If omitted
          or negative, no truncation occurs.
        schema:
          type: integer
