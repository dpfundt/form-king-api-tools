          x-pointInTimeStability: FROZEN_POST_RESULT
        horse:
          type: string
          description: Name of the horse. **Point-in-time integrity:** Locked once
            the race is officially resulted. May rarely be amended by a stewards'
            disqualification or protest ruling issued after the meeting.
          example: Obambulate
          x-pointInTimeStability: FROZEN_POST_RESULT
        jockey:
          type: string
          description: Name of the jockey. **Point-in-time integrity:** Locked once
