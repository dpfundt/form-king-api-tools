        mostRecentTrainer:
          type: string
          description: The most recent trainer of the horse.
        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/PastEvent'
          description: Full career list of past race, trial, spell and scratched entries
            for the horse.
      required:
      - id
      description: A complete profile for a horse, including full past race, trial,
        spell and scratching items, benchmarked sectional data and performance ratings.
        Data depth will depend on subscription level.
      title: HorseForm
    HorseLite:
      type: object
