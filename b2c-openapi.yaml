      type: object
      title: UsageMetadata
      properties:
        callType:
          type: string
          description: Sub-type or context of the call, if applicable.
        horseId:
          type: string
          description: Horse ID associated with the API call, if applicable.
        meetingId:
          type: string
          description: Meeting ID associated with the API call, if applicable.
          example: ABNY_150526
        raceId:
          type: string
          description: Race ID associated with the API call, if applicable.
      required: []
      description: Contextual request parameters and metadata captured during API
        invocation.
    UsageOperationSummary:
      type: object
      title: UsageOperationSummary
      properties:
        calls:
          type: integer
          description: Total number of API calls for this operation.
        credits:
          type: integer
          description: Total credits deducted for this operation.
      required:
      - calls
      - credits
      description: Breakdown of call counts and total credits deducted for a specific
        API operation.
  parameters:
    FormatParam:
      name: format
      in: query
      required: false
      description: Response format. Defaults to `json`. Set to `csv` to receive a
        CSV file instead.
      schema:
        type: string
        enum:
        - json
        - csv
        default: json
    FlattenParam:
      name: flatten
      in: query
      required: false
      description: "Controls the flattening level when `format=csv`. `entry` (default)\
        \ \u2014 one row per entry with `meeting_*` and `race_*` columns prepended;\
        \ `race` \u2014 one row per race with `meeting_*` columns prepended; `meeting`\
        \ \u2014 one row per meeting (fully flattened)."
      schema:
        type: string
        enum:
        - entry
        - race
        - meeting
        default: entry
    VersionParam:
      name: version
      in: query
      required: false
      description: API projection version. Currently only `v1` is supported.
      schema:
        type: string
        enum:
        - v1
        default: v1
security:
- ApiKeyAuth: []
tags:
- name: Meetings
  description: Endpoints for retrieving horse racing meeting information, including
    upcoming meetings and full meeting summaries.
- name: Races
  description: Endpoints for retrieving detailed race information, including runner
    form enriched with horse profile data.
- name: Horses
  description: Endpoints for retrieving individual horse form profiles, including
    past events and benchmarked sectional data.
- name: Account
  description: Endpoints for account management, usage logging, and subscription self-service.
