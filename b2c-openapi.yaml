          x-pointInTimeStability: FROZEN_PRE_RACE
        restrictions:
          type: string
          description: A string containing class, age, gender and weight restrictions
            for the race. **Point-in-time integrity:** Locked at the scheduled race
            jump time and never rewritten afterwards.
          example: MDN.2+..S
          x-pointInTimeStability: FROZEN_PRE_RACE
        stageId:
          type: string
