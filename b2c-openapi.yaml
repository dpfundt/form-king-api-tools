        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/PastEvent'
          description: Past form for this horse, including weight-adjusted and WFA
            ratings, and optionally benchmarking data. Depth depends on user subscription
            tier and API being called. **Point-in-time integrity:** Locked at the
            scheduled race jump time and never rewritten afterwards.
          x-pointInTimeStability: FROZEN_PRE_RACE
        raceEntryId:
          type: string
          description: Unique Form King identifier for the race entry, comprised of
            raceId and saddlecloth number. **Point-in-time integrity:** Locked at
