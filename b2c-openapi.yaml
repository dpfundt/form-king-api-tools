        vsAllAvg:
          type: number
          description: Lengths +/- the Form King All Average Benchmark for this section.
            Positive is above par. **Point-in-time integrity:** Always recalculated
            and never frozen - treat as a point-in-time snapshot only, not safe for
            modelling against forever.
