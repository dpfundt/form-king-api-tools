          x-pointInTimeStability: RECALCULATED
        seconds:
          type: integer
          description: Number of second-place finishes in this window. **Point-in-time
            integrity:** Always recalculated and never frozen - treat as a point-in-time
            snapshot only, not safe for modelling against forever.
          x-pointInTimeStability: RECALCULATED
        thirds:
          type: integer
          description: Number of third-place finishes in this window. **Point-in-time
            integrity:** Always recalculated and never frozen - treat as a point-in-time
            snapshot only, not safe for modelling against forever.
          x-pointInTimeStability: RECALCULATED
        wins:
          type: integer
          description: Number of wins in this window. **Point-in-time integrity:**
            Always recalculated and never frozen - treat as a point-in-time snapshot
            only, not safe for modelling against forever.
          x-pointInTimeStability: RECALCULATED
        winsOverExpectations:
          type: number
          description: Wins above the market-implied expectation across all starts
            in this window. A value of 1 means that wins = expectedWins. A value above
            1 means that there have been more wins than expected wins, and below 1
            is less than expected. **Point-in-time integrity:** Always recalculated
            and never frozen - treat as a point-in-time snapshot only, not safe for
            modelling against forever.
          x-pointInTimeStability: RECALCULATED
      required:
      - averageBeatenMargin
      - averageFirmOrDrift
      - proportionalStakingROI
      - races
      - seconds
      - thirds
      - wins
      - winsOverExpectations
      description: A summary of form for horses that ran in a past race, across a
        defined window of subsequent starts (ALL, NEXT_10, or NEXT_20).
